<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Low-Poly Physics Crafting Sandbox</title>
<meta name="description" content="Prototype game 3D open-world low-poly berbasis web: tebang pohon, rakit kendaraan roket, dan terbang. Ringan untuk HP low-end.">
<meta name="theme-color" content="#aee0ff">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#aee0ff; overscroll-behavior:none;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* Visibilitas UI per mode (play / build / drive) */
  body:not([data-mode=build]) .build-only { display:none !important; }
  body[data-mode=build] .play-only { display:none !important; }
  body:not([data-mode=drive]) .drive-only { display:none !important; }
  body[data-mode=drive] .nodrive { display:none !important; }
  .rbtn { position:absolute; border-radius:9999px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(20,40,30,.55); border:3px solid rgba(255,255,255,.75); color:#fff; font-weight:600;
    pointer-events:auto; transition:transform .08s, background .15s; touch-action:none; }
  .rbtn:active, .rbtn.down { transform:scale(.88); background:rgba(255,255,255,.35); }
  #btnGlideDown.fast-active { background:linear-gradient(135deg,rgba(2,132,199,0.95),rgba(14,165,233,1)) !important; border-color:#fff !important; box-shadow:0 0 25px rgba(56,189,248,0.9), 0 0 10px #fff !important; transform:scale(0.92); }
  .rbtn .ico { line-height:1; display:flex; align-items:center; justify-content:center; }
  .rbtn .lbl { font-size:11px; margin-top:2px; text-shadow:0 1px 2px #000; }
  .slot { width:62px; height:62px; border-radius:10px; background:rgba(0,0,0,.35); border:3px solid transparent; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; line-height:1.1; text-align:center; }
  .slot .ico { font-size:24px; display:flex; align-items:center; justify-content:center; margin-bottom:2px; }
  .slot.active { border-color:#fff; background:rgba(255,255,255,.2); }
  .chip { background:rgba(15,30,25,.6); border-radius:8px; padding:4px 10px; font-size:12px; color:#fff; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,255,120,.7);} 50%{ box-shadow:0 0 0 12px rgba(255,255,120,0);} }
  .near { animation:pulse 1s infinite; }
</style>
</head>
<body data-mode="play">

<canvas id="gl" class="fixed inset-0 block" style="width:100%;height:100%"></canvas>

<!-- ================= UI OVERLAY ================= -->
<main id="ui" class="fixed inset-0 pointer-events-none">
  <!-- Efek layar: glare matahari (transform/opacity saja => murah di GPU) & kilat petir -->
  <div id="glareWash" class="absolute inset-0" style="opacity:0;mix-blend-mode:screen;background:radial-gradient(ellipse at center, rgba(255,244,214,.6), rgba(255,236,190,.3))"></div>
  <div id="glare" class="absolute left-0 top-0 rounded-full" style="width:75vmax;height:75vmax;opacity:0;mix-blend-mode:screen;will-change:transform,opacity;background:radial-gradient(circle, rgba(255,253,240,.95) 0, rgba(255,242,200,.55) 5%, rgba(255,220,150,.2) 20%, rgba(255,200,120,0) 58%)"></div>
  <div class="flare absolute left-0 top-0 rounded-full" data-t="-0.45" style="width:70px;height:70px;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle, rgba(255,235,170,.55), rgba(255,210,130,0) 70%)"></div>
  <div class="flare absolute left-0 top-0 rounded-full" data-t="0.25" style="width:40px;height:40px;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle, rgba(170,255,200,.45), rgba(120,220,170,0) 70%)"></div>
  <div class="flare absolute left-0 top-0 rounded-full" data-t="0.6" style="width:110px;height:110px;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle, rgba(160,200,255,0) 45%, rgba(160,200,255,.35) 62%, rgba(160,200,255,0) 72%)"></div>
  <div class="flare absolute left-0 top-0 rounded-full" data-t="1.1" style="width:55px;height:55px;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle, rgba(255,170,120,.45), rgba(255,140,100,0) 70%)"></div>
  <div id="flash" class="absolute inset-0 bg-white" style="opacity:0"></div>


  <!-- kanan atas: FPS + menu kualitas -->
  <div class="absolute top-2 right-2 flex items-center gap-2 pointer-events-auto">
    <div id="fps" class="chip">FPS: --</div>
    <button id="btnMenu" class="w-11 h-11 rounded-lg bg-black/50 hover:bg-black/70 text-white flex items-center justify-center shadow-lg active:scale-95 transition-all" aria-label="Pengaturan">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </div>

  <!-- Modal Pengaturan Fullscreen Transparan & Scrollable -->
  <div id="settingsPopup" class="hidden fixed inset-0 z-[1000] flex items-center justify-center p-3 sm:p-6 bg-black/60 backdrop-blur-md pointer-events-auto">
    <div class="relative w-full max-w-md max-h-[88vh] flex flex-col rounded-2xl bg-slate-900/80 border border-white/20 shadow-2xl text-white overflow-hidden backdrop-blur-xl">
      <!-- Header Modal -->
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-white/10 bg-white/5">
        <div class="flex items-center gap-2 font-bold text-base tracking-wide">
          <svg class="w-5 h-5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Pengaturan Game</span>
        </div>
        <button id="btnCloseSettings" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 active:scale-90 flex items-center justify-center text-white/80 font-bold transition-all" aria-label="Tutup">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Body Modal (Scrollable) -->
      <div class="p-5 space-y-4 overflow-y-auto overscroll-contain text-sm" style="-webkit-overflow-scrolling:touch;">
        <!-- Kualitas Grafis -->
        <div>
          <div class="text-xs font-semibold uppercase tracking-wider text-white/60 mb-1.5">Kualitas Grafis</div>
          <div id="qualityBtns" class="flex gap-2">
            <button data-q="0" class="qbtn flex-1 py-2.5 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">Low</button>
            <button data-q="1" class="qbtn flex-1 py-2.5 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">Medium</button>
            <button data-q="2" class="qbtn flex-1 py-2.5 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">High</button>
          </div>
          <div class="text-[11px] text-white/50 mt-1">Bayangan dinamis real-time & resolusi tajam aktif di kualitas High.</div>
        </div>

        <!-- Limit FPS -->
        <div>
          <div class="text-xs font-semibold uppercase tracking-wider text-white/60 mb-1.5">Limit FPS</div>
          <div id="fpsLimitBtns" class="flex gap-2">
            <button data-fps="30" class="fps-btn flex-1 py-2 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">30 FPS</button>
            <button data-fps="60" class="fps-btn flex-1 py-2 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">60 FPS</button>
            <button data-fps="120" class="fps-btn flex-1 py-2 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">120 FPS</button>
          </div>
        </div>

        <!-- Waktu Hari -->
        <div>
          <div class="text-xs font-semibold uppercase tracking-wider text-white/60 mb-1.5">Waktu Hari (Day / Night)</div>
          <div class="grid grid-cols-5 gap-1.5">
            <button data-tod="auto" class="tod-btn py-2 rounded-xl bg-white/10 border-2 border-transparent text-xs font-medium active:scale-95 transition-all">Auto</button>
            <button data-tod="dawn" class="tod-btn py-2 rounded-xl bg-white/10 border-2 border-transparent text-xs font-medium active:scale-95 transition-all flex items-center justify-center gap-1">
              <svg class="w-3.5 h-3.5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v4M4.93 10.93l2.83-2.83M19.07 10.93l-2.83-2.83M2 18h20M16 18a4 4 0 0 0-8 0"/></svg>
              <span>Pagi</span>
            </button>
            <button data-tod="day" class="tod-btn py-2 rounded-xl bg-white/10 border-2 border-transparent text-xs font-medium active:scale-95 transition-all flex items-center justify-center gap-1">
              <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
              <span>Siang</span>
            </button>
            <button data-tod="dusk" class="tod-btn py-2 rounded-xl bg-white/10 border-2 border-transparent text-xs font-medium active:scale-95 transition-all flex items-center justify-center gap-1">
              <svg class="w-3.5 h-3.5 text-orange-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M4.93 10.93l2.83-2.83M19.07 10.93l-2.83-2.83M2 18h20M16 18a4 4 0 0 0-8 0M12 17l-2-2M12 17l2-2"/></svg>
              <span>Sore</span>
            </button>
            <button data-tod="night" class="tod-btn py-2 rounded-xl bg-white/10 border-2 border-transparent text-xs font-medium active:scale-95 transition-all flex items-center justify-center gap-1">
              <svg class="w-3.5 h-3.5 text-sky-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span>Malam</span>
            </button>
          </div>
        </div>

        <!-- Cuaca -->
        <div>
          <div class="text-xs font-semibold uppercase tracking-wider text-white/60 mb-1.5">Cuaca Lingkungan</div>
          <div class="flex gap-2">
            <button data-wx="auto" class="wx-btn flex-1 py-2 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">Auto</button>
            <button data-wx="clear" class="wx-btn flex-1 py-2 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all flex items-center justify-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
              <span>Cerah</span>
            </button>
            <button data-wx="rain" class="wx-btn flex-1 py-2 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all flex items-center justify-center gap-1.5">
              <svg class="w-3.5 h-3.5 text-sky-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 13v6M8 13v6M12 15v6M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>
              <span>Hujan</span>
            </button>
          </div>
        </div>

        <!-- Tampilan & Suara -->
        <div>
          <div class="text-xs font-semibold uppercase tracking-wider text-white/60 mb-1.5">Tampilan & Audio</div>
          <div class="flex flex-col gap-2">
            <button id="btnFullscreen" class="w-full py-2.5 rounded-xl bg-emerald-600/75 hover:bg-emerald-600/90 active:scale-[0.98] font-semibold transition-all flex items-center justify-center gap-2">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              <span id="fsLbl">Fullscreen: Off</span>
            </button>
            <button id="btnSound" class="w-full py-2.5 rounded-xl bg-sky-600/75 hover:bg-sky-600/90 active:scale-[0.98] font-semibold transition-all flex items-center justify-center gap-2">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              <span id="soundLbl">Suara: On</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Footer Modal -->
      <div class="px-5 py-3 border-t border-white/10 bg-white/5 flex justify-end">
        <button id="btnCloseSettingsBottom" class="w-full py-2.5 rounded-xl bg-white/15 hover:bg-white/25 active:scale-[0.98] font-semibold text-sm transition-all">Tutup Pengaturan</button>
      </div>
    </div>
  </div>

  <!-- Modal Opsi Preset Pesawat -->
  <div id="presetPopup" class="hidden fixed inset-0 z-[1000] flex items-center justify-center p-3 sm:p-6 bg-black/60 backdrop-blur-md pointer-events-auto">
    <div class="relative w-full max-w-lg max-h-[88vh] flex flex-col rounded-2xl bg-slate-900/90 border border-white/20 shadow-2xl text-white overflow-hidden backdrop-blur-xl">
      <!-- Header Modal -->
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-white/10 bg-white/5">
        <div class="flex items-center gap-2 font-bold text-base tracking-wide text-sky-300">
          <svg class="w-5 h-5 text-sky-400" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
          <span>Pilih Rancangan Preset Pesawat</span>
        </div>
        <button id="btnClosePreset" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 active:scale-90 flex items-center justify-center text-white/80 font-bold transition-all" aria-label="Tutup">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Body Modal (Daftar Preset) -->
      <div id="presetListContainer" class="p-4 sm:p-5 space-y-3 overflow-y-auto overscroll-contain text-sm" style="-webkit-overflow-scrolling:touch;">
      </div>

      <!-- Footer Modal -->
      <div class="px-5 py-3 border-t border-white/10 bg-white/5 flex items-center justify-between text-xs text-white/60">
        <span>Bahan di landasan otomatis di-refund saat memilih preset</span>
        <button id="btnClosePresetBottom" class="py-1.5 px-4 rounded-lg bg-white/15 hover:bg-white/25 active:scale-95 font-semibold text-white transition-all">Tutup</button>
      </div>
    </div>
  </div>

  <!-- kiri atas: Minimap di Kiri, UI Looting di KANAN Minimap -->
  <div class="absolute top-2 left-2 flex items-start gap-2.5 pointer-events-auto">
    <!-- Minimap Radar Container (Transparan & Glassmorphic) -->
    <div id="minimapWrap" class="relative rounded-2xl overflow-hidden border border-white/20 shadow-xl bg-slate-950/35 backdrop-blur-md shrink-0" style="width:112px;height:112px;">
      <canvas id="minimapCanvas" width="112" height="112" class="block w-full h-full"></canvas>
    </div>

    <!-- Sisi Kanan Minimap: UI Informasi Looting & Tombol Build -->
    <div class="flex flex-col gap-1.5">
      <!-- Badge Inventory Looting Ringkas (Kayu, Sayap, Roket, Senjata) -->
      <div class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl bg-slate-950/60 backdrop-blur-md border border-white/15 text-white text-xs font-semibold shadow-lg">
        <div class="flex items-center gap-1" title="Kayu">
          <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M4 7c0-1.66 3.58-3 8-3s8 1.34 8 3v10c0 1.66-3.58 3-8 3s-8-1.34-8-3V7zm8-1c-3.31 0-6 .9-6 2s2.69 2 6 2 6-.9 6-2-2.69-2-6-2z"/></svg>
          <span id="woodCount" class="text-amber-300 font-bold">0</span>
        </div>
        <span class="text-white/30 text-[10px]">•</span>
        <div class="flex items-center gap-1" title="Sayap">
          <svg class="w-3.5 h-3.5 text-cyan-400 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M21 4c-5 0-11 3-15 7-2 2-3 5-3 8 4 0 7-1 9-3 4-4 7-10 9-12z"/></svg>
          <span id="wingCount" class="text-cyan-300 font-bold">0</span>
        </div>
        <span class="text-white/30 text-[10px]">•</span>
        <div class="flex items-center gap-1" title="Roket Pendorong">
          <svg class="w-3.5 h-3.5 text-rose-400 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5s3 3.5 3 8.5c1.5.5 3.5 2 4.5 4.5-1.5 0-3-.5-4.5-1-.5 2-1.5 3.5-3 4.5-1.5-1-2.5-2.5-3-4.5-1.5.5-3 1-4.5 1 1-2.5 3-4 4.5-4.5 0-5 3-8.5 3-8.5zM12 11a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>
          <span id="thrCount" class="text-rose-300 font-bold">0</span>
        </div>
        <span class="text-white/30 text-[10px]">•</span>
        <div class="flex items-center gap-1" title="Senjata Tembak">
          <svg class="w-3.5 h-3.5 text-red-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13h4l2-4h8l2 4h4v3H2z"/><path d="M12 5v4M9 9h6"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span id="gunCount" class="text-red-300 font-bold">2</span>
        </div>
      </div>

      <!-- Tombol Aksi Build Mode (Hanya tampil saat mode build) -->
      <div class="build-only flex gap-1.5 pointer-events-auto">
        <button id="btnPreset" class="chip border border-white/30 text-xs py-1.5 px-3 flex items-center gap-1.5 bg-sky-950/70 hover:bg-sky-900/80 active:scale-95 transition-all shadow" title="Pilih Rancangan Preset">
          <svg class="w-3.5 h-3.5 text-sky-300 shrink-0" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
          <span>Pilih Preset</span>
        </button>
        <button id="btnClear" class="chip border border-white/30 text-xs py-1.5 px-3 flex items-center gap-1.5 bg-rose-950/70 hover:bg-rose-900/80 active:scale-95 transition-all shadow">
          <svg class="w-3.5 h-3.5 text-rose-300 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span>Bersihkan</span>
        </button>
      </div>
    </div>
  </div>


  <div id="toast" class="absolute top-16 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg bg-black/65 text-white text-sm opacity-0 transition-opacity duration-300 whitespace-nowrap"></div>

  <!-- Virtual joystick (kiri: ukuran lebih ringkas dan digeser ke kanan agar nyaman di jempol) -->
  <div id="joyBase" class="nobuild play-only absolute pointer-events-auto rounded-full"
       style="left:48px;bottom:26px;width:110px;height:110px;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);touch-action:none">

<script>
/* =====================================================================
 *  LOW-POLY PHYSICS CRAFTING SANDBOX  —  single file, tanpa asset eksternal
 *  Struktur:
 *   1. Setup renderer/scene (optimasi mobile)      6. Particle (api / debu)
 *   2. Terrain prosedural (grid height + sampling) 7. Mode Build (grid snap)
 *   3. Pohon & batu (InstancedMesh)                8. Fisika kendaraan
 *   4. Karakter blocky + animasi                   9. Kamera, input, game loop
 *   5. Input / UI helper
 * ===================================================================== */
(() => {
'use strict';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);   // ?aa=1 => aktifkan antialias

/* ------------------------------------------------------------------ *
 * 1. RENDERER & SCENE  (optimasi: tanpa antialias, tanpa shadow map,
 *    Lambert material, pixel ratio terbatas, fog + far plane pendek)
 * ------------------------------------------------------------------ */
const SKY = 0xaee0ff;
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: params.get('aa') === '1', powerPreference: 'high-performance' });
renderer.shadowMap.enabled = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 250, 950);               // sembunyikan batas map luas dengan kabut atmosfer
const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 1100);
const hemi = new THREE.HemisphereLight(0xe3f3ff, 0x6f9250, 0.95); scene.add(hemi);
// Arah matahari (dipakai untuk cahaya, posisi sprite matahari, dan bayangan)
const SUN_DIR = new THREE.Vector3(0.5, 0.42, -0.76).normalize();
const sun = new THREE.DirectionalLight(0xfff2d8, 0.75); sun.position.copy(SUN_DIR).multiplyScalar(100); scene.add(sun); scene.add(sun.target);
// Konfigurasi shadow map (hanya dinyalakan saat kualitas HIGH)
sun.shadow.mapSize.set(1024, 1024);
{ const sc = sun.shadow.camera; sc.left = sc.bottom = -36; sc.right = sc.top = 36; sc.near = 1; sc.far = 220; sc.updateProjectionMatrix(); }
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.05;
let onQualityChange = null;                            // diisi oleh modul lingkungan (bayangan)

// Level kualitas (render scale). Default HIGH (resolusi tinggi).
const QUALITY = [
  { name: 'LOW',  pr: 0.6 },
  { name: 'MED',  pr: Math.min(devicePixelRatio || 1, 1) },
  { name: 'HIGH', pr: Math.min(devicePixelRatio || 1, 2) }
];
let qIdx = 2; // Default HIGH resolution
function applyQuality() {
  renderer.setPixelRatio(QUALITY[qIdx].pr);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (onQualityChange) onQualityChange();
}
addEventListener('resize', applyQuality);
applyQuality();

// Material cache & util
const matCache = {};
const lam = c => matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color: c }));
// Ubah geometry jadi flat-shaded (non-indexed + normal per face) => tampilan low-poly tajam
function flat(g) { const n = g.toNonIndexed(); n.computeVertexNormals(); g.dispose(); return n; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

/* ------------------------------------------------------------------ *
 * 2. TERRAIN PROSEDURAL
 *    Tinggi disimpan di grid (hGrid). Mesh dibangun dari grid yang sama
 *    dan groundY() meng-interpolasi segitiga yang sama => fisika pas
 *    dengan visual, tanpa raycast.
 * ------------------------------------------------------------------ */
function rng32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng32(1337);
function hash2(i, j) { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {                          // value noise 2D
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o) { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += vnoise(x * f, y * f) * a; n += a; a *= .5; f *= 2; } return s / n; }
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const T_SIZE = 1800, T_N = 200, T_D = T_SIZE / T_N, T_HALF = T_SIZE / 2, T_W = T_N + 1;
const SITE = { x: 0, y: 0.2, z: 14 };            // lokasi area rakit (pad)
const PAD_HALF = 120; // Luas area crafting bebas tanpa batasan sempit
const hGrid = new Float32Array(T_W * T_W);

function genHeight(ix, iz) {
  const x = ix * T_D - T_HALF, z = iz * T_D - T_HALF;
  const rr = Math.hypot(x, z - 6);
  const flatF = sstep(45, 190, rr);                                  // dataran luas di sekitar spawn & pad
  let h = (fbm(x * .0025, z * .0025, 4) - .5) * 65 * flatF;          // perbukitan & lembah luas
  const m = sstep(480, 860, rr);                                     // cincin pegunungan tinggi di tepian map
  const ridge = 1 - Math.abs(2 * fbm(x * .003 + 9, z * .003 + 4, 4) - 1);
  h += m * (32 + ridge * ridge * 130);
  h += (hash2(ix, iz) - .5) * (1 + m * 6) * flatF;                  // kontur rugged/berbatu
  const cm = sstep(.48, .72, fbm(x * .0045 - 5, z * .0045 + 7, 2)); // tebing bertingkat
  const s = h / 7, f = Math.floor(s), fr = s - f;
  h += (((f + sstep(.4, .6, fr)) * 7) - h) * cm * .85 * flatF;
  return h;
}
for (let iz = 0; iz < T_W; iz++) for (let ix = 0; ix < T_W; ix++) hGrid[iz * T_W + ix] = genHeight(ix, iz);

// Interpolasi tinggi persis sesuai triangulasi mesh: (00,01,11) & (00,11,10)
function cellInfo(x, z) {
  const gx = clamp((x + T_HALF) / T_D, 0, T_N - 1e-4), gz = clamp((z + T_HALF) / T_D, 0, T_N - 1e-4);
  const ix = gx | 0, iz = gz | 0;
  return [ix, iz, gx - ix, gz - iz];
}
function terrainY(x, z) {
  const [ix, iz, u, v] = cellInfo(x, z);
  const h00 = hGrid[iz * T_W + ix], h10 = hGrid[iz * T_W + ix + 1], h01 = hGrid[(iz + 1) * T_W + ix], h11 = hGrid[(iz + 1) * T_W + ix + 1];
  return v >= u ? h00 + u * (h11 - h01) + v * (h01 - h00) : h00 + v * (h11 - h10) + u * (h10 - h00);
}
function groundNormal(x, z, out) {
  const [ix, iz, u, v] = cellInfo(x, z);
  const h00 = hGrid[iz * T_W + ix], h10 = hGrid[iz * T_W + ix + 1], h01 = hGrid[(iz + 1) * T_W + ix], h11 = hGrid[(iz + 1) * T_W + ix + 1];
  let dx, dz;
  if (v >= u) { dx = (h11 - h01) / T_D; dz = (h01 - h00) / T_D; } else { dx = (h10 - h00) / T_D; dz = (h11 - h10) / T_D; }
  return out.set(-dx, 1, -dz).normalize();
}
// Permukaan efektif = terrain alami (langsung dataran tanah tanpa papan fisik)
function surfaceY(x, z) {
  return terrainY(x, z);
}

function terrainColor(cy, ny, r) {
  if (cy > 85 && ny > .55) return [.92 + r * .06, .94 + r * .05, .97];        // salju di puncak pegunungan
  if (ny < .70) { const g = .36 + r * .14; return [g, g * .97, g * .92]; }     // tebing batu abu-abu
  if (ny < .82) { const g = .36 + r * .1; return [g + .14, g + .03, g * .7]; } // tanah berbatu
  const t = clamp(cy / 60, 0, 1);                                              // rumput
  return [.25 + r * .08 + t * .10, .62 + r * .10 - t * .14, .17 + r * .05];
}
(function buildTerrain() {
  const tris = T_N * T_N * 2, pos = new Float32Array(tris * 9), col = new Float32Array(tris * 9);
  let p = 0;
  const put = (x, y, z, c) => { pos[p] = x; pos[p + 1] = y; pos[p + 2] = z; col[p] = c[0]; col[p + 1] = c[1]; col[p + 2] = c[2]; p += 3; };
  for (let iz = 0; iz < T_N; iz++) for (let ix = 0; ix < T_N; ix++) {
    const x0 = ix * T_D - T_HALF, z0 = iz * T_D - T_HALF, x1 = x0 + T_D, z1 = z0 + T_D;
    const h00 = hGrid[iz * T_W + ix], h10 = hGrid[iz * T_W + ix + 1], h01 = hGrid[(iz + 1) * T_W + ix], h11 = hGrid[(iz + 1) * T_W + ix + 1];
    // segitiga A
    let ny = T_D / Math.hypot(h11 - h01, T_D, h01 - h00) ; // aproksimasi normal.y
    let c = terrainColor((h00 + h01 + h11) / 3, ny, hash2(ix * 2, iz));
    put(x0, h00, z0, c); put(x0, h01, z1, c); put(x1, h11, z1, c);
    // segitiga B
    ny = T_D / Math.hypot(h10 - h00, T_D, h11 - h10);
    c = terrainColor((h00 + h11 + h10) / 3, ny, hash2(ix * 2 + 1, iz));
    put(x0, h00, z0, c); put(x1, h11, z1, c); put(x1, h10, z0, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();                                       // non-indexed => flat shading
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })));
})();

// Area rakit langsung di atas dataran (tanpa papan fisik & tanpa garis grid visual; pad proxy tak terlihat untuk raycast tap)
const padMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
const pad = new THREE.Mesh(new THREE.BoxGeometry(PAD_HALF * 2, .4, PAD_HALF * 2), padMat);
pad.position.set(SITE.x, SITE.y - 0.2, SITE.z); pad.visible = false; scene.add(pad);

// Marker suar cahaya ke langit dan papan crafting telah dihapus sepenuhnya (crafting langsung di tanah)

// Awan sederhana (kotak putih, murah)
const clouds = [];
{ const cm = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (let i = 0; i < 30; i++) {
    const g = new THREE.Group();
    for (let k = 0; k < 4; k++) { const b = new THREE.Mesh(new THREE.BoxGeometry(14 + rand() * 16, 3.5 + rand() * 2.5, 9 + rand() * 8), cm); b.position.set(k * 11 - 18 + rand() * 5, rand() * 2, rand() * 8); g.add(b); }
    g.position.set((rand() * 2 - 1) * 880, 130 + rand() * 80, (rand() * 2 - 1) * 880); scene.add(g); clouds.push(g);
  } }

/* ------------------------------------------------------------------ *
 * 3. POHON & BATU  (InstancedMesh => draw call minimal)
 * ------------------------------------------------------------------ */
// Spatial hash untuk collision pemain (pohon/batu)
const OB_CELL = 16, obGrid = new Map();
const obKey = (cx, cz) => `${cx},${cz}`;
function obAdd(o) { const k = obKey(Math.floor(o.x / OB_CELL), Math.floor(o.z / OB_CELL)); let a = obGrid.get(k); if (!a) obGrid.set(k, a = []); a.push(o); }
function obResolve(p, rad) {
  const cx = Math.floor(p.x / OB_CELL), cz = Math.floor(p.z / OB_CELL);
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const a = obGrid.get(obKey(cx + dx, cz + dz)); if (!a) continue;
    for (const o of a) {
      if (o.alive === false) continue;
      const ex = p.x - o.x, ez = p.z - o.z, d = Math.hypot(ex, ez), mn = o.r + rad;
      if (d < mn && d > 1e-4) { p.x = o.x + ex / d * mn; p.z = o.z + ez / d * mn; }
    }

}

function mergeGeos(geos) {
  const nonIndexed = geos.map(g => g.index ? g.toNonIndexed() : g);
  let totalVerts = 0;
  for (let i = 0; i < nonIndexed.length; i++) totalVerts += nonIndexed[i].attributes.position.count;
  const posArr = new Float32Array(totalVerts * 3);
  let offset = 0;
  for (let i = 0; i < nonIndexed.length; i++) {
    const p = nonIndexed[i].attributes.position.array;
    posArr.set(p, offset * 3);
    offset += nonIndexed[i].attributes.position.count;
    nonIndexed[i].dispose();
  }
  const merged = new THREE.BufferGeometry();
  merged.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  merged.computeVertexNormals();
  return flat(merged);

// -------------------------------------------------------------
// GEOMETRI 6 VARIAN POHON (Tanpa Palm, Daun Lebih Variatif: Hijau, Orange, Kuning)
// -------------------------------------------------------------
// Type 0: DECIDUOUS (Oak / Rindang berkubah banyak)
const geoTrunk0 = mergeGeos([
  new THREE.CylinderGeometry(0.24, 0.36, 2.2, 5).translate(0, 1.1, 0),
  new THREE.CylinderGeometry(0.12, 0.18, 1.1, 5).rotateZ(0.55).translate(-0.4, 2.1, 0.1),
  new THREE.CylinderGeometry(0.12, 0.18, 1.2, 5).rotateZ(-0.5).rotateY(0.4).translate(0.45, 2.2, -0.15)
]);

  new THREE.DodecahedronGeometry(1.25, 0).translate(0, 3.2, 0),
  new THREE.DodecahedronGeometry(0.9, 0).translate(-0.85, 2.5, 0.2),
  new THREE.DodecahedronGeometry(0.95, 0).translate(0.85, 2.6, -0.25),
  new THREE.DodecahedronGeometry(0.75, 0).translate(0.1, 2.4, 0.8)

// Type 1: CONIFER (PINE / Cemara bertingkat)
const geoTrunk1 = flat(new THREE.CylinderGeometry(0.20, 0.30, 2.0, 5).translate(0, 1.0, 0));
const geoFol1 = mergeGeos([
  new THREE.ConeGeometry(1.65, 1.8, 6).translate(0, 2.1, 0),
  new THREE.ConeGeometry(1.25, 1.6, 6).translate(0, 3.3, 0),

const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _sv = new THREE.Vector3(), _ax = new THREE.Vector3();
const Y_AXIS = new THREE.Vector3(0, 1, 0), X_AXIS = new THREE.Vector3(1, 0, 0), Z_AXIS = new THREE.Vector3(0, 0, 1);
const _c = new THREE.Color();

function writeTree(i) {
  const t = treeData[i];
  const trMesh = trunkInsts[t.type];
  const folMesh = foliageInsts[t.type];
  if (t.state === 2) {
    trMesh.setMatrixAt(t.instIdx, ZERO);
    if (folMesh) folMesh.setMatrixAt(t.instIdx, ZERO);
    return;
  }
  let sc = t.s;
  _q.setFromAxisAngle(Y_AXIS, t.rotY);
  if (t.state === 1) { // animasi tumbang
    const f = Math.min(1, t.t / .7);
    _ax.set(t.dz, 0, -t.dx);
    _q2.setFromAxisAngle(_ax, f * f * 1.5);
    _q.premultiply(_q2);
    if (t.t > .7) sc *= Math.max(0, 1 - (t.t - .7) / .25);
  } else if (t.shake > 0) { // getar saat dipukul
    _q2.setFromAxisAngle(X_AXIS, Math.sin(t.shake * 70) * t.shake * .5);
    _q.premultiply(_q2);
  }
  _m.compose(_p.set(t.x, t.y, t.z), _q, _sv.setScalar(sc));
  trMesh.setMatrixAt(t.instIdx, _m);
  if (folMesh) folMesh.setMatrixAt(t.instIdx, _m);
}

// Generator warna dedaunan variatif: Hijau (zamrud / lime), Orange (musim gugur cerah), Kuning (keemasan / kenari)
// Generator warna dedaunan variatif: Hijau Alami (Rimba, Zamrud, Zaitun, Lime & Golden-Green)
function sampleFoliageColor(treeType) {
  const r = rand();
  const j = (rand() - 0.5) * 0.05;

  // Cemara / Pine (1): mayoritas hijau pinus lebat alami & cemara gunung gelap
  if (treeType === 1) {
    if (r < 0.65) {
      // Hijau Pinus Alami (Pine Green)
      return { r: 0.08 + rand() * 0.05, g: 0.38 + rand() * 0.10, b: 0.18 + rand() * 0.05 };
    } else if (r < 0.88) {
      // Hijau Pinus Segar (Mountain Spruce)
      return { r: 0.12 + j, g: 0.44 + j * 0.6, b: 0.20 + rand() * 0.04 };
    } else {
      // Hijau Lumut Dalam (Deep Moss Pine)
      return { r: 0.06 + rand() * 0.04, g: 0.34 + rand() * 0.06, b: 0.14 + rand() * 0.03 };
    }
  }

  // Pohon Rindang (Oak 0), Birch (2), Semak (Bush 3), Baobab (4):
  // 100% Nuansa Hijau Alami yang sejuk dan harmonis (tanpa warna jingga/kemerahan)
  if (r < 0.45) {
    // 1. Hijau Zamrud & Hutan Rimba (Lush Emerald & Forest Green)
    if (rand() < 0.5) {
      return { r: 0.10 + rand() * 0.05, g: 0.52 + rand() * 0.10, b: 0.18 + rand() * 0.05 };
    } else {
      return { r: 0.16 + rand() * 0.06, g: 0.58 + rand() * 0.10, b: 0.22 + rand() * 0.05 };
    }
  } else if (r < 0.80) {
    // 2. Hijau Zaitun & Padang Rumput (Meadow Green & Olive Canopy)
    if (rand() < 0.5) {
      return { r: 0.18 + rand() * 0.06, g: 0.55 + rand() * 0.09, b: 0.14 + rand() * 0.04 };
    } else {
      return { r: 0.22 + rand() * 0.06, g: 0.62 + rand() * 0.08, b: 0.16 + rand() * 0.04 };
    }
  } else {
    // 3. Hijau Muda Segar / Daun Birch Keemasan Lembut (Spring Chartreuse & Warm Leaf Green)
    return { r: 0.26 + rand() * 0.07, g: 0.65 + rand() * 0.08, b: 0.14 + rand() * 0.04 };
  }
}

// Inisialisasi posisi dan warna per varian pohon (100% natural, variasi dedaunan kaya)
for (let i = 0; i < treeData.length; i++) {
  const t = treeData[i];
  const trMesh = trunkInsts[t.type];
  const folMesh = foliageInsts[t.type];
  const idx = t.instIdx;

  if (t.type === 0) { // Deciduous (Oak)
    trMesh.setColorAt(idx, _c.setRGB(.42 + rand() * .08, .27 + rand() * .05, .13));
  } else if (t.type === 1) { // Pine / Conifer
    trMesh.setColorAt(idx, _c.setRGB(.34 + rand() * .06, .21 + rand() * .04, .11));
  } else if (t.type === 2) { // Birch (batang putih-krem khas)
    trMesh.setColorAt(idx, _c.setRGB(.80 + rand() * .08, .78 + rand() * .08, .70 + rand() * .06));
  } else if (t.type === 3) { // Bush / Shrub
    trMesh.setColorAt(idx, _c.setRGB(.36, .26, .15));
  } else if (t.type === 4) { // Baobab (batang raksasa keabuan)
    trMesh.setColorAt(idx, _c.setRGB(.48 + rand() * .08, .42 + rand() * .07, .36 + rand() * .06));
  } else { // Dead tree (batang lapuk kayu tua)
    trMesh.setColorAt(idx, _c.setRGB(.38 + rand() * .08, .34 + rand() * .06, .28 + rand() * .06));
  }

  if (folMesh) {
    const fc = sampleFoliageColor(t.type);
    folMesh.setColorAt(idx, _c.setRGB(fc.r, fc.g, fc.b));
    t.folColorArr = [fc.r, fc.g, fc.b];
  }
  writeTree(i);
}

function createRocketPickupMesh() {

 * 6. PARTICLE SYSTEM (pool Points, tanpa alokasi per frame)
 * ------------------------------------------------------------------ */
function makePS(N, size, additive, map) {
  const pos = new Float32Array(N * 3).fill(-9999), col = new Float32Array(N * 3), vel = new Float32Array(N * 3);
  const life = new Float32Array(N), mx = new Float32Array(N).fill(1), c0 = new Float32Array(N * 3), c1 = new Float32Array(N * 3), gr = new Float32Array(N);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size, map: map || null, vertexColors: true, transparent: true, depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending
  }));
  pts.frustumCulled = false; scene.add(pts);
  let head = 0, dirty = false;
  return {
    emit(x, y, z, vx, vy, vz, l, a, b, g) {
      const i = head; head = (head + 1) % N; const k = i * 3;
      pos[k] = x; pos[k + 1] = y; pos[k + 2] = z; vel[k] = vx; vel[k + 1] = vy; vel[k + 2] = vz;
      life[i] = mx[i] = l; gr[i] = g || 0;
      c0[k] = a[0]; c0[k + 1] = a[1]; c0[k + 2] = a[2]; c1[k] = b[0]; c1[k + 1] = b[1]; c1[k + 2] = b[2]; dirty = true;
    },
    update(dt) {
      for (let i = 0; i < N; i++) {
        if (life[i] <= 0) continue; const k = i * 3;
        life[i] -= dt; dirty = true;
        if (life[i] <= 0) { pos[k + 1] = -9999; continue; }
        const t = 1 - life[i] / mx[i];
        vel[k + 1] -= gr[i] * dt;
        pos[k] += vel[k] * dt; pos[k + 1] += vel[k + 1] * dt; pos[k + 2] += vel[k + 2] * dt;
        const f = additive ? Math.min(1, (1 - t) * 2.2) : 1;
        col[k] = (c0[k] + (c1[k] - c0[k]) * t) * f; col[k + 1] = (c0[k + 1] + (c1[k + 1] - c0[k + 1]) * t) * f; col[k + 2] = (c0[k + 2] + (c1[k + 2] - c0[k + 2]) * t) * f;
      }
      if (dirty) { geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true; dirty = false; }
    }
  };
}

function makeSmokePS(N, size) {
  const pos = new Float32Array(N * 3).fill(-9999), col = new Float32Array(N * 3), vel = new Float32Array(N * 3);
  const life = new Float32Array(N), mx = new Float32Array(N).fill(1);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size, map: smokeTex, vertexColors: true, transparent: true, depthWrite: false, opacity: 0.75
  }));
  pts.frustumCulled = false; scene.add(pts);
  let head = 0, dirty = false;
  return {
    emit(x, y, z, vx, vy, vz, l) {
      const i = head; head = (head + 1) % N; const k = i * 3;
      pos[k] = x; pos[k + 1] = y; pos[k + 2] = z;
      vel[k] = vx; vel[k + 1] = vy; vel[k + 2] = vz;
      life[i] = mx[i] = l;
      col[k] = 0.94; col[k + 1] = 0.95; col[k + 2] = 0.98;
      dirty = true;
    },
    update(dt) {
      for (let i = 0; i < N; i++) {
        if (life[i] <= 0) continue; const k = i * 3;
        life[i] -= dt; dirty = true;
        if (life[i] <= 0) { pos[k + 1] = -9999; continue; }
        const t = 1 - life[i] / mx[i];
        vel[k] *= 0.97;
        vel[k + 1] = vel[k + 1] * 0.97 + 0.12 * dt; // perlahan membubung lembut ke atas
        vel[k + 2] *= 0.97;
        pos[k] += vel[k] * dt; pos[k + 1] += vel[k + 1] * dt; pos[k + 2] += vel[k + 2] * dt;
        // Bertahan jelas di sebagian besar durasi (5-7 detik), lalu memudar di akhir
        const alpha = Math.min(1, (1 - t) * 1.6);
        const br = 0.88 * alpha;
        col[k] = br; col[k + 1] = br * 0.98; col[k + 2] = br * 1.02;
      }
      if (dirty) { geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true; dirty = false; }
    }
  };
}

// Statistik kendaraan dengan Center of Mass & Momen Aerodinamis Sayap Sejati (Relatif terhadap CoM)
function computeStats() {
  let blocks = 0, wings = 0, thr = 0, guns = 0;
  let sumMass = 0;
  let sumMx = 0, sumMy = 0, sumMz = 0;

  parts.forEach(p => {
    let m = 0.80;
    if (p.type === 'wing') { wings++; m = 0.22; }        // Sayap aerodinamis ringan & stabil
    else if (p.type === 'thruster') { thr++; m = 0.38; }  // Roket pendorong ringan
    else if (p.type === 'gun') { guns++; m = 0.45; }      // Senjata tembak seimbang
    else { blocks++; m = 0.80; }

    sumMass += m;
    const py = p.j + 0.5;
    sumMx += m * p.i;
    sumMy += m * py;
    sumMz += m * p.k;
  });

  // Jika belum ada part, default ke titik tengah grid (0, 0.5, 0)
  const partsMass = sumMass || 1.2;
  const comX = parts.size ? (sumMx / sumMass) : 0;
  const comY = parts.size ? (sumMy / sumMass) : 0.5;
  const comZ = parts.size ? (sumMz / sumMass) : 0;
  const mass = partsMass + 0.8; // Massa pilot bertumpu di pusat massa kendaraan

  // Hitung momen ketidakseimbangan RELATIF terhadap Center of Mass (CoM) kendaraan itu sendiri!
  // Ini memastikan pesawat yang simetris akan selalu seimbang 100%, di manapun posisi dibuatnya di grid.
  let wingsL = 0, wingsR = 0;
  let wingLiftX = 0, wingLiftZ = 0;
  let thrX = 0, thrY = 0;

  parts.forEach(p => {
    const relX = p.i - comX;
    const relY = (p.j + 0.5) - comY;
    const relZ = p.k - comZ;

    if (p.type === 'wing') {
      if (relX < -0.1) wingsL++;
      else if (relX > 0.1) wingsR++;
      // Lengan momen lateral sayap relatif terhadap sumbu CoM pesawat
      wingLiftX += relX;
      wingLiftZ += relZ;

function updateProjectiles(dt) {

    const aeroYaw = -st.wingImbalanceX * 0.10 * clamp(vf / 12, 0, 1.6);
    const thrYaw = st.thrX * 0.25 * (gas ? 1 : 0);
    dYaw += (aeroYaw + thrYaw) * dt;
  } else {
    // Di tanah: kemudi roda saat bergerak
    if (Math.abs(ax.x) > 0.1) {
      dYaw += -ax.x * 1.8 * clamp(speed / 8, 0.4, 1.2) * dt;
    }
  }

  // 3. Torsi Pitch Asimetris (Di udara):
  if (!veh.contact) {
    const aeroPitch = -st.wingImbalanceZ * 0.02 * clamp((vf * vf) / 100, 0, 0.3);
    const thrPitch = -st.thrY * 0.10 * (gas ? 1 : 0);
    dPitch += (aeroPitch + thrPitch) * dt;
  }

  // 4. Stabilitas Sayap & Auto-Level (Roll & Pitch):
  const asymmetryFactor = clamp(Math.abs(st.wingImbalanceX) * 0.25 + Math.abs(st.thrX) * 0.35, 0, 0.90);
  const autoLevelPower = Math.max(0.05, 1.0 - asymmetryFactor);

  if (Math.abs(ax.x) < .1) {
    dRoll += -_r.y * (.35 + wingsC * .15) * 2 * autoLevelPower * dt;
  }

  // AUTO-LEVEL PITCH: Mengembalikan hidung pesawat ke posisi terbang horizontal alami saat joystick dilepas
  if (Math.abs(ax.y) < .1 && st.wings > 0) {
    dPitch += -_f.y * (0.8 + wingsC * 0.2) * autoLevelPower * dt;
  }

  if (!veh.contact && speed > 4 && st.wings > 0) {
    const aoa = Math.atan2(veh.vel.dot(_u), vf), beta = Math.atan2(veh.vel.dot(_r), vf);
    const k = clamp(speed / 15, 0, 1);
    const safeAoA = clamp(aoa, -0.15, 0.2);
    dPitch += safeAoA * wingsC * .12 * k * dt;
    dYaw += -beta * wingsC * .2 * k * dt;
  }
  if (!veh.contact && st.wings === 0 && st.count > 0) dPitch -= .3 * dt; // tanpa sayap: hidung jatuh

  // Bank-to-turn aerodinamis HANYA aktif saat pesawat benar-benar terbang di udara (BUKAN di tanah!)
  const worldYaw = (!veh.contact && speed > 4) ? _r.y * 1.1 * clamp(speed / 12, 0, 1) * (st.wings > 0 ? 1 : .4) * dt : 0;

  // Anti-terjungkal saat menyentuh tanah: angkat hidung jika mengarah ke tanah saat melaju
  if (veh.contact) {
    if (_f.y < -0.02) dPitch += Math.max(1.8, -_f.y * 5.0) * dt;
    else if (Math.abs(ax.y) < .1) dPitch += -_f.y * 3 * dt;
  }
  _q2.setFromAxisAngle(X_AXIS, dPitch); veh.quat.multiply(_q2);
  _q2.setFromAxisAngle(Z_AXIS, dRoll); veh.quat.multiply(_q2);
  _q2.setFromAxisAngle(Y_AXIS, dYaw); veh.quat.multiply(_q2);
  _q2.setFromAxisAngle(Y_AXIS, worldYaw); veh.quat.premultiply(_q2);
  veh.quat.normalize();

  /* --- gaya linier --- */
  _a.set(0, -PHYS.GRAV, 0);
  if (gas) _a.addScaledVector(_f, st.thr * PHYS.THRUST / st.mass);                     // thrust semua roket
  const lift = vf > 0 ? Math.min(st.wings * PHYS.CL * vf * vf / st.mass, PHYS.GRAV * PHYS.MAXLIFT_G) : 0;
  _a.addScaledVector(_u, lift);                                                        // lift sayap
  const cd = (.03 + .004 * st.count) / st.mass;                                        // drag kuadratik
  _a.addScaledVector(veh.vel, -cd * speed - .02);
  veh.vel.addScaledVector(_a, dt);
  if (vf > 3) {                                                                        // sayap meluruskan vektor kecepatan
    const al = Math.min(1, (.15 + wingsC * .25) * dt) * clamp(vf / 15, 0, 1);
    veh.vel.addScaledVector(_t1.copy(_f).multiplyScalar(veh.vel.dot(_f)).sub(veh.vel), al);
  }
  veh.pos.addScaledVector(veh.vel, dt);

  /* --- tabrakan tanah/tebing: titik sudut bounding vs terrain --- */
  let worst = 0, wx = 0, wy = 0, wz = 0; veh.contact = false;
  for (const c of veh.corners) {
    _t1.copy(c).applyQuaternion(veh.quat).add(veh.pos);
    const pen = surfaceY(_t1.x, _t1.z) - _t1.y;
    if (pen > 0) { veh.contact = true; if (pen > worst) { worst = pen; wx = _t1.x; wy = _t1.y; wz = _t1.z; } }
  }
  if (worst > 0) {
    groundNormal(wx, wz, _n);
    veh.pos.addScaledVector(_n, Math.min(worst, 3));
    const vn = veh.vel.dot(_n);
    if (vn < 0) {
      veh.vel.addScaledVector(_n, -vn * 1.1);
      if (-vn > 7 && veh.impactCd <= 0) {                                            // efek benturan + kendaraan sedikit bergeser
        veh.impactCd = .3; shake = Math.min(1, -vn / 22); veh.vel.multiplyScalar(.85);
        burst(wx, wy, wz, 16, C_DUST, C_FOG, 7, 2, .8);
        burst(wx, wy, wz, 5, C_SPARK, C_DUST, 6, 3, .4);
      }
    }
    // gesekan roda: redam gerak menyamping, gelinding sedikit melambat
    _t1.copy(veh.vel).addScaledVector(_f, -veh.vel.dot(_f));
    veh.vel.addScaledVector(_t1, -Math.min(1, 6 * dt));
    if (!gas) veh.vel.addScaledVector(_f, -veh.vel.dot(_f) * .25 * dt);
  }

  /* --- tabrakan pesawat dengan pohon & rintangan batu (obGrid) --- */
  const vcx = Math.floor(veh.pos.x / OB_CELL), vcz = Math.floor(veh.pos.z / OB_CELL);
  const planeRad = veh.rad || 1.6;
  const processedObs = new Set();

  for (let dx = -1; dx <= 1; dx++) {
    for (let dz = -1; dz <= 1; dz++) {
      const arr = obGrid.get(obKey(vcx + dx, vcz + dz));
      if (!arr) continue;
      for (const o of arr) {
        if (o.alive === false || processedObs.has(o)) continue;
        processedObs.add(o);

        const ogy = o.y !== undefined ? o.y : surfaceY(o.x, o.z);
        const otop = ogy + (o.h !== undefined ? o.h : 7);
        // Cek rentang vertikal rintangan
        if (veh.pos.y < ogy - 1.2 || veh.pos.y > otop + 1.8) continue;

        // Radius efektif: batang di bawah vs daun di atas
        const inCanopy = o.h && veh.pos.y > ogy + 3.0;
        const effR = inCanopy ? (o.r * 1.4 + 0.5) : (o.r + 0.4);
        const minD = planeRad + effR;

        const ex = veh.pos.x - o.x, ez = veh.pos.z - o.z;
        const distXZ = Math.hypot(ex, ez);

        if (distXZ < minD) {
          const nx = distXZ > 1e-4 ? ex / distXZ : 1;
          const nz = distXZ > 1e-4 ? ez / distXZ : 0;
          // Batasi push maksimum per frame agar pesawat tidak pernah terpental jauh (anti-slingshot)
          const push = Math.min(minD - distXZ, 1.2);
          veh.pos.x += nx * push;
          veh.pos.z += nz * push;

          // Koreksi vektor kecepatan normal secara inelastis (tanpa gaya pegas/pelontar liar)
          const vDotN = veh.vel.x * nx + veh.vel.z * nz;
          if (vDotN < 0) {
            veh.vel.x -= 1.1 * vDotN * nx;
            veh.vel.z -= 1.1 * vDotN * nz;
            veh.vel.multiplyScalar(0.68);
          }

          // Efek benturan & guncangan layar HANYA terjadi saat tabrakan nyata (bukan saat menempel diam di pohon)
          // Mencegah bug infinite getar layar
          const isHardHit = vDotN < -1.6;
          if (isHardHit && veh.impactCd <= 0) {
            veh.impactCd = 0.26;
            const hitY = clamp(veh.pos.y, ogy + 0.5, otop);
            burst(veh.pos.x - nx * 0.8, hitY, veh.pos.z - nz * 0.8, speed > 14 ? 8 : 4, C_WOOD, C_DUST, 3, 1.2, 0.4);
            const impShake = Math.min(0.42, Math.abs(vDotN) * 0.028);
            shake = Math.min(0.55, shake + impShake);
          }

          // Logika pohon tumbang / goyang:
          // HANYA saat ada benturan nyata; pohon tidak terus berguncang saat ditempel
          if (o.hp !== undefined && isHardHit) {
            if (speed >= 16.0) {
              o.hp -= (speed > 25 ? 4 : 2);
              o.shake = 0.45;
              const tidx = treeData.indexOf(o);
              if (tidx >= 0) animTrees.add(tidx);
              if (o.hp <= 0 && o.state === 0) {
                o.state = 1; o.t = 0; o.alive = false;
                o.dx = -nx; o.dz = -nz;
                toast('💥 Pohon tumbang tertabrak pesawat!');
              }
            } else {
              // Kecepatan pelan: hanya goyang lembut sesaat, pohon tidak tumbang
              o.shake = Math.min(0.2, speed * 0.015);
              const tidx = treeData.indexOf(o);
              if (tidx >= 0) animTrees.add(tidx);
            }
          }
        }
      }
    }
  }

  veh.impactCd -= dt;
  const lim = T_HALF - 15;
  if (Math.abs(veh.pos.x) > lim) { veh.pos.x = clamp(veh.pos.x, -lim, lim); veh.vel.x *= -.3; }
  if (Math.abs(veh.pos.z) > lim) { veh.pos.z = clamp(veh.pos.z, -lim, lim); veh.vel.z *= -.3; }
  if (veh.pos.y < -50) { veh.pos.set(SITE.x, SITE.y + 6, SITE.z); veh.vel.set(0, 0, 0); }

  /* --- EFEK ROKET REALISTIS (3D Mach Shock Plumes + Partikel Volumetrik + Dynamic PointLight) --- */
  if (gas && veh.thrusters.length > 0) {
    // Parameter getaran turbulensi dan panjang semburan dinamis
    const pJitter = 0.96 + Math.sin(time * 65) * 0.05 + (Math.random() - 0.5) * 0.08;
    const pStretch = 1.0 + Math.sin(time * 38) * 0.12 + Math.min(speed / 25, 0.45);

    if (typeof plumeGroup !== 'undefined') {
      plumeGroup.visible = true;

      // 1. Animasi dinamis getaran turbulensi Mach shock cone & shock diamonds
      flamePlumeMat.opacity = 0.62 + Math.sin(time * 50) * 0.10;
      flameCoreMat.opacity = 0.90 + Math.sin(time * 70) * 0.08;
      machDiamondMat.opacity = 0.84 + Math.sin(time * 85) * 0.12;

      for (let j = 0; j < plumeGroup.children.length; j++) {
        const tg = plumeGroup.children[j];
        if (tg.children.length >= 5) {
          tg.children[0].scale.set(pJitter, pJitter, pStretch);
          tg.children[1].scale.set(pJitter * 0.95, pJitter * 0.95, pStretch * 0.92);
          const dScale = 1.0 + Math.sin(time * 75 + j) * 0.18;
          tg.children[2].scale.set(dScale, dScale, dScale);
          tg.children[3].scale.set(dScale * 0.72, dScale * 0.72, dScale * 0.72);
          tg.children[4].scale.set(dScale * 0.48, dScale * 0.48, dScale * 0.48);
        }
      }
    }

    // 2. Semburan partikel api volumetrik & asap yang sejalan sempurna dengan keluarnya api roket
    const maxT = Math.min(veh.thrusters.length, 6);
    for (let i = 0; i < maxT; i++) {
      const t = veh.thrusters[i];
      // Posisi ujung nosel di koordinat dunia
      _t1.copy(t).applyQuaternion(veh.quat).add(veh.pos);

      // Sumbu arah semburan keluar dari nosel roket (ke arah belakang nosel: -_f)
      const exX = -_f.x, exY = -_f.y, exZ = -_f.z;

      // a. Partikel api (fireFX) mengalir di dalam dan sepanjang kerucut lidah api (0.4m hingga 2.2m di belakang nosel)
      const fireDist = 0.4 + Math.random() * (1.8 * pStretch);
      const firePosX = _t1.x + exX * fireDist + (Math.random() - .5) * 0.05;
      const firePosY = _t1.y + exY * fireDist + (Math.random() - .5) * 0.05;
      const firePosZ = _t1.z + exZ * fireDist + (Math.random() - .5) * 0.05;

      // Kecepatan partikel api: Mewarisi kecepatan pesawat + dorongan relatif lurus keluar dari nosel (exX, exY, exZ)
      // Ini menjamin pergerakan partikel api 100% konsisten, searah, dan sejalan dengan keluarnya api roket
      const fireRelSp = 6.0 + Math.random() * 3.0;
      fireFX.emit(
        firePosX, firePosY, firePosZ,
        veh.vel.x + exX * fireRelSp,
        veh.vel.y + exY * fireRelSp,
        veh.vel.z + exZ * fireRelSp,
        0.18 + Math.random() * 0.08,
        [1.0, 0.98, 0.85],  // Inti plasma putih-emas sangat panas
        [0.85, 0.10, 0.01],  // Ekor merah matang membara
        0
      );
    }

    // 3. Dynamic Real-Time PointLight di belakang nosel menyinari badan pesawat & daratan
    if (typeof rocketLight !== 'undefined') {
      rocketLight.position.copy(veh.pos).addScaledVector(_f, -1.2);
      rocketLight.intensity = 2.6 + Math.sin(time * 55) * 0.6 + (Math.random() - 0.5) * 0.4;
    }
  } else {
    if (typeof plumeGroup !== 'undefined') plumeGroup.visible = false;
    if (typeof rocketLight !== 'undefined' && rocketLight.intensity > 0) {
      rocketLight.intensity = Math.max(0, rocketLight.intensity - dt * 16);
    }
  }
}

// Joystick virtual
const joyBase = $('joyBase'), joyKnob = $('joyKnob'), JR = 35;
function moveJoy(e) {
  const r = joyBase.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy); if (d > JR) { dx *= JR / d; dy *= JR / d; }
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; joy.x = dx / JR; joy.y = -dy / JR;
}
function endJoy(e) { if (e.pointerId !== joy.id) return; joy.id = null; joy.x = joy.y = 0; joyKnob.style.transform = 'translate(-50%,-50%)'; }
joyBase.addEventListener('pointerdown', e => { e.preventDefault(); joy.id = e.pointerId; joyBase.setPointerCapture(e.pointerId); moveJoy(e); });

// Helper tap modal yang aman dari scroll gesture
function addModalTap(el, cb) {
  if (!el) return;
  let sx = 0, sy = 0, moved = false;
  el.addEventListener('pointerdown', e => {
    sx = e.clientX; sy = e.clientY; moved = false;
  }, { passive: true });
  el.addEventListener('pointermove', e => {
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) moved = true;
  }, { passive: true });
  el.addEventListener('pointerup', e => {
    if (!moved) cb(e);
  });
}

// Drag kamera + pinch zoom + tap (build) di canvas
const pointers = new Map(); let pinch0 = 0;
const pinchDist = () => { const a = [...pointers.values()]; return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); };
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 });
  if (pointers.size === 2) pinch0 = pinchDist();

  const p = pointers.get(e.pointerId);
  if (!p) { if (mode === 'build' && e.pointerType === 'mouse') updateGhost(e.clientX, e.clientY); return; }
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; p.moved += Math.abs(dx) + Math.abs(dy);
  const c = cam[mode];
  if (pointers.size === 1) { c.yaw -= dx * .006; c.pitch = clamp(c.pitch + dy * .005, -.5, 1.3); }
  else if (pointers.size === 2) { const d = pinchDist(); if (pinch0 > 0) c.dist = clamp(c.dist * pinch0 / d, 4, mode === 'build' ? 48 : mode === 'drive' ? 30 : 22); pinch0 = d; }
});
function endPtr(e) {
  const p = pointers.get(e.pointerId); if (!p) return;
  if (mode === 'build' && pointers.size === 1 && p.moved < 10 && performance.now() - p.t < 450) buildTap(e.clientX, e.clientY);
  pointers.delete(e.pointerId);
}

function updatePlayer(dt) {
  const a = getAxis(), sy = Math.sin(cam.play.yaw), cy = Math.cos(cam.play.yaw);

    const keyFast = !!(keys.ShiftLeft || keys.ShiftRight || keys.Space || keys.KeyS || keys.ArrowDown || keys.KeyF || keys.KeyE);
    const isFastDescend = parachuteFast || input.glideDown || keyFast;
    const glideSpeed = isFastDescend ? 11.5 : 8.5;
    player.x += mx * glideSpeed * dt;
    player.z += mz * glideSpeed * dt;
    if (mag > 0.05) {
      let da = Math.atan2(mx, mz) - player.yaw;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      player.yaw += da * Math.min(1, 8 * dt);
    }
    // Laju turun: -13.5 m/s jika turun cepat, -3.2 m/s jika melayang santai
    const targetVy = isFastDescend ? -13.5 : -3.2;
    const lerpRate = isFastDescend ? 7.5 : 5.0;
    player.vy = THREE.MathUtils.lerp(player.vy, targetVy, lerpRate * dt);
    player.y += player.vy * dt;

    const lim = T_HALF - 15; player.x = clamp(player.x, -lim, lim); player.z = clamp(player.z, -lim, lim);

    // Animasi parasut berayun dinamis & aerodinamis saat turun cepat
    parachuteGroup.visible = true;
    parachuteGroup.rotation.z = Math.sin(time * 2.5) * 0.06 - a.x * 0.16;
    parachuteGroup.rotation.x = a.y * 0.16 + (isFastDescend ? 0.22 : 0);
    armL.rotation.x = isFastDescend ? -2.9 : -2.7;
    armR.rotation.x = isFastDescend ? -2.9 : -2.7;
    legL.rotation.x = (isFastDescend ? 0.45 : 0.25) + Math.sin(time * 5) * 0.08;
    legR.rotation.x = (isFastDescend ? 0.35 : -0.15) + Math.cos(time * 5) * 0.08;

    if (isFastDescend) {
      canopyMesh.scale.set(0.85, 1.25, 0.85);
      canopyMat.color.setHex(0xff3d00);
      shake = Math.max(shake, 0.035);
      if (Math.random() < 0.35) {
        dustFX.emit(player.x + (Math.random() - .5) * 1.2, player.y + 2.5, player.z + (Math.random() - .5) * 1.2,
          (Math.random() - .5) * 0.5, 4 + Math.random() * 3, (Math.random() - .5) * 0.5,
          0.2, 0xffffff, 0xcceeff, 0);
      }
    } else {
      canopyMesh.scale.set(1, 1, 1);
      canopyMat.color.setHex(0xff5722);
    }

    // Deteksi sentuh tanah -> lipat parasut & pulihkan aksi tombol normal kembali
    if (player.y <= gy) {
      player.y = gy;
      player.vy = 0;
      player.grounded = true;
      player.parachute = false;
      parachuteFast = false;
      input.glideDown = false;
      parachuteGroup.visible = false;
      canopyMesh.scale.set(1, 1, 1);
      canopyMat.color.setHex(0xff5722);
      burst(player.x, gy + 0.1, player.z, 16, C_DUST, C_FOG, 4, 1.2, 0.7);
      toast('🪂 Mendarat dengan aman!');
    }

    model.rotation.y = player.yaw;
    playerBlob.position.set(player.x, gy + 0.05, player.z);
    return;
  }

  chop.cd -= dt;

    const i = findTree(3.8); if (i >= 0) player.yaw = Math.atan2(treeData[i].x - player.x, treeData[i].z - player.z);

  $('btnSprint').classList.toggle('down', !!(input.sprint || keys.ShiftLeft || keys.ShiftRight));

  if (rocketPickups.length > 0) {

      if (!r || r.collected) continue;
      const rdx = player.x - r.x, rdz = player.z - r.z;
      if (rdx * rdx + rdz * rdz < 6.5 && Math.abs(player.y - r.y) < 3.2) {

  for (let i = 0; i < rocketPickups.length; i++) {

  // Arah hadap (heading) yang 100% akurat dan sinkron dengan koordinat 3D:

  let fx, fz;

  // Kerucut pandang lembut (view cone) agar arah pandang terlihat jelas
  const coneGrad = ctx.createRadialGradient(0, 0, 2, 0, -14, 16);
  coneGrad.addColorStop(0, 'rgba(0, 229, 255, 0.35)');
  coneGrad.addColorStop(1, 'rgba(0, 229, 255, 0.0)');
  ctx.fillStyle = coneGrad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-8, -18);
  ctx.lineTo(8, -18);
  ctx.closePath();
  ctx.fill();

  // Panah penunjuk arah tajam, presisi, dan kontras
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -11);      // Ujung panah tajam menunjuk ke depan
  ctx.lineTo(-4.5, 3.5);   // Sayap kiri
  ctx.lineTo(0, 0.5);      // Cekungan dalam
  ctx.lineTo(4.5, 3.5);    // Sayap kanan
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();

  ctx.restore();
}

function sampleSky(t) {
  // t: 0..1
  let k0, k1, f;
  if (t < 0.25) { k0 = P_NIGHT; k1 = P_DAWN;  f = t / 0.25; }
  else if (t < 0.50) { k0 = P_DAWN;  k1 = P_DAY;   f = (t - 0.25) / 0.25; }

    sky: new THREE.Color(k0.sky).lerp(_c.set(k1.sky), f),
    fog: new THREE.Color(k0.fog).lerp(_c.set(k1.fog), f),
    sun: new THREE.Color(k0.sun).lerp(_c.set(k1.sun), f),
    hemiS: new THREE.Color(k0.hemiS).lerp(_c.set(k1.hemiS), f),

      toast(wx.target ? '🌧️ Hujan mulai turun...' : '☀️ Cuaca cerah kembali');
    }
  } else wx.target = wx.mode === 'rain' ? 1 : 0;
  wx.k += clamp(wx.target - wx.k, -dt / 7, dt / 7);
  const k = wx.k;

  if (k > .6) { wx.nextBolt -= dt; if (wx.nextBolt <= 0) { strike(focus); wx.nextBolt = 4 + Math.random() * 9; } }
  wx.flashT += dt;
  const fl = wx.flashT < 1.5 ? flashLevel(wx.flashT) : 0;
  bolt.visible = wx.flashT < .32 && fl > .2;

  // Interpolasi Langit, Kabut, Matahari dengan Cuaca & Petir
  scene.background.copy(pal.sky).lerp(C_SKY_RAIN, k).lerp(C_FLASH, fl * .7);
  scene.fog.color.copy(pal.fog).lerp(C_SKY_RAIN, k).lerp(C_FLASH, fl * .7);
  scene.fog.near = (250 - 160 * k); scene.fog.far = (950 - 450 * k);
  hemi.color.copy(pal.hemiS); hemi.groundColor.copy(pal.hemiG);
  hemi.intensity = pal.hemiI * (1 - 0.35 * k) + fl * 1.2;
  sun.intensity = pal.sunI * (1 - 0.65 * k);
  sun.color.copy(pal.sun).lerp(C_SUN_RAIN, k);
  cloudMat.color.setRGB(1, 1, 1).lerp(new THREE.Color(0x353d48), nightFactor * 0.7).lerp(C_CLOUD_RAIN, k);
  flashEl.style.opacity = fl > .01 ? (fl * .35).toFixed(3) : 0;

  updateRain(dt, k, focus);
  updateSun(dt, (1 - k) * (1 - nightFactor));
  if (sfx.rainGain) { const g = sfx.on ? k * .16 : 0; if (Math.abs(g - sfx.last) > .003) { sfx.rainGain.gain.value = g; sfx.last = g; } }

  // 3. Render Minimap Radar
  drawMinimap();
}

// --- UI pengaturan cuaca, waktu hari & suara ---
function refreshWxUI() {
  document.querySelectorAll('.wx-btn').forEach(b => { const act = b.dataset.wx === wx.mode;
    b.style.borderColor = act ? '#fff' : 'transparent'; b.style.background = act ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)'; });
  document.querySelectorAll('.tod-btn').forEach(b => { const act = b.dataset.tod === tod.mode;
    b.style.borderColor = act ? '#fff' : 'transparent'; b.style.background = act ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)'; });
  const soundIcon = sfx.on
    ? '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>'
    : '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
  $('btnSound').innerHTML = `${soundIcon}<span>Suara: ${sfx.on ? 'On' : 'Off'}</span>`;
}
$('btnMenu').addEventListener('pointerdown', refreshWxUI);
document.querySelectorAll('.wx-btn').forEach(b => addModalTap(b, () => {
  wx.mode = b.dataset.wx;
  if (wx.mode === 'auto') { wx.target = wx.k > .5 ? 1 : 0; wx.timer = 40 + Math.random() * 40; }
  if (wx.mode === 'rain') wx.nextBolt = 2;
  refreshWxUI(); toast(`Cuaca: ${b.textContent.trim()}`);
}));
document.querySelectorAll('.tod-btn').forEach(b => addModalTap(b, () => {
  tod.mode = b.dataset.tod;
  refreshWxUI(); toast(`Waktu: ${b.textContent.trim()}`);
}));
addModalTap($('btnSound'), () => { sfx.on = !sfx.on; refreshWxUI(); });

/* ---------- Game loop ---------- */
let last = performance.now(), fAcc = 0, fN = 0;
function update(dt) {
  time += dt;
  updateProjectiles(dt);
  for (const c of clouds) { c.position.x += dt * 2.5; if (c.position.x > 900) c.position.x = -900; }
  if (mode === 'play') updatePlayer(dt);
  if (veh.sim) {                                  // 2 sub-step agar tidak tembus tanah saat cepat
    const h = dt / 2; stepVehicle(h, mode === 'drive'); stepVehicle(h, mode === 'drive'); applyVehicleTransform();
    vehBlob.visible = true; const gy = surfaceY(veh.pos.x, veh.pos.z); vehBlob.position.set(veh.pos.x, gy + .06, veh.pos.z);
    vehBlob.scale.setScalar(clamp(3 - (veh.pos.y - gy) * .04, 1, 3));
  } else vehBlob.visible = false;
  // bayangan blob murah hanya dipakai jika shadow map OFF
  if (shadowsOn) vehBlob.visible = false;
  playerBlob.visible = !shadowsOn && mode !== 'drive';

  // animasi pohon (tumbang / getar)
  if (animTrees.size) {
    for (const i of animTrees) {
      const t = treeData[i];
      if (t.state === 1) { t.t += dt; if (t.t >= .95) { t.state = 2; animTrees.delete(i); } }
      else { t.shake -= dt; if (t.shake <= 0) { t.shake = 0; animTrees.delete(i); } }
      writeTree(i);
    }
    markTrees();
  }
  fireFX.update(dt); dustFX.update(dt);

  // Animasi roket tercecer di map: rotasi & melayang (bobbing)
  if (rocketPickups.length > 0) {
    for (let idx = 0; idx < rocketPickups.length; idx++) {
      const r = rocketPickups[idx];
      if (!r || r.collected) continue;
      r.mesh.rotation.y += dt * r.rotSpeed;
      r.mesh.position.y = r.baseY + Math.sin(time * 3.2 + r.phase) * 0.18;
    }
  }

  updateCamera(dt);
  updateWeather(dt);                              // setelah kamera: sprite matahari, glare & hujan ikut posisi kamera

  // Visibilitas tombol aksi: Saat parasut aktif, HANYA tombol 'Turun' yang tampil!
  const isParachuting = !!player.parachute;
  const keyFast = !!(keys.ShiftLeft || keys.ShiftRight || keys.Space || keys.KeyS || keys.ArrowDown || keys.KeyF || keys.KeyE);
  const isFastDescend = isParachuting && (parachuteFast || input.glideDown || keyFast);
  document.body.dataset.parachute = isParachuting ? 'true' : 'false';

  const btnGlideEl = $('btnGlideDown');
  if (isParachuting) {
    if (btnGlideEl) {
      btnGlideEl.style.display = 'flex';
      btnGlideEl.classList.toggle('fast-active', isFastDescend);
    }
    $('btnSprint').style.display = 'none';
    $('btnJump').style.display = 'none';
    $('btnCraft').style.display = 'none';
    $('btnChop').style.display = 'none';
    $('btnAct').style.display = 'none';
    if ($('btnShoot')) $('btnShoot').style.display = 'none';
  } else {
    if (btnGlideEl) btnGlideEl.style.display = 'none';
    $('btnSprint').style.display = (mode === 'play') ? 'flex' : 'none';
    $('btnJump').style.display = (mode === 'play') ? 'flex' : 'none';

    // Tombol Craft selalu siap digunakan kapan saja dan di mana saja!
    $('btnCraft').style.display = (mode === 'play' || mode === 'build') ? 'flex' : 'none';
    $('btnCraft').classList.remove('near');

    // Tombol Tebang (btnChop): HANYA tampil saat mode drive (untuk gas) atau saat mode play dekat pohon
    const nearTreeIdx = (mode === 'play') ? findTree(3.8) : -1;
    const canChop = (mode === 'drive') || (mode === 'play' && nearTreeIdx >= 0);
    $('btnChop').style.display = canChop ? 'flex' : 'none';
    if (mode === 'play' && nearTreeIdx >= 0) {
      if ($('chopLbl').textContent !== 'Tebang') {
        $('chopIco').innerHTML = SVG_ICONS.axe;
        $('chopLbl').textContent = 'Tebang';
      }
      $('btnChop').classList.add('near');
    } else if (mode === 'drive') {
      if ($('chopLbl').textContent !== 'GAS') {
        $('chopIco').innerHTML = SVG_ICONS.fire;
        $('chopLbl').textContent = 'GAS';
      }
      $('btnChop').classList.remove('near');
    } else {
      $('btnChop').classList.remove('near');
    }

    // Tombol Interaksi (btnAct): HANYA tampil jika memang ada sesuatu yang bisa di-interaksikan!
    const canInteract = (mode === 'drive') || (mode === 'play' && veh.sim && parts.size > 0 && Math.hypot(player.x - veh.pos.x, player.z - veh.pos.z) <= 9);
    $('btnAct').style.display = canInteract ? 'flex' : 'none';
    $('btnAct').classList.toggle('near', mode === 'play' && canInteract);
  }
}
function loop(now) {
  requestAnimationFrame(loop);
  if (fpsLimit > 0) {
    const minDelta = (1000 / fpsLimit) - 1.5; // toleransi jitter timer rAF
    if (now - last < minDelta) return;
  }
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); renderer.render(scene, camera);
  fAcc += dt; fN++; if (fAcc >= .5) { $('fps').textContent = 'FPS: ' + Math.round(fN / fAcc); fAcc = 0; fN = 0; }
}

// Inisialisasi: kendaraan kosong siap, pemain di dekat pad
updateStats(); prepareVehicle(); veh.sim = false;
vehGroup.position.set(SITE.x, SITE.y, SITE.z); partRoot.position.set(0, 0, 0);
refreshQualityUI(); refreshFpsLimitUI(); refreshFsUI(); refreshWxUI();
toast('Kumpulkan Kayu, Sayap & Roket lalu rakit di Crafting Pad');
requestAnimationFrame(loop);
})();
</script>
