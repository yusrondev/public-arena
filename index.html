<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Low-Poly Physics Crafting Sandbox</title>
<meta name="description" content="Prototype game 3D open-world low-poly berbasis web: tebang pohon, rakit kendaraan roket, dan terbang. Ringan untuk HP low-end.">
<meta name="theme-color" content="#aee0ff">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#aee0ff; overscroll-behavior:none;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* Visibilitas UI per mode (play / build / drive) */
  body:not([data-mode=build]) .build-only { display:none !important; }
  body[data-mode=build] .play-only { display:none !important; }
  body:not([data-mode=drive]) .drive-only { display:none !important; }
  body[data-mode=drive] .nodrive { display:none !important; }
  .rbtn { position:absolute; border-radius:9999px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(20,40,30,.55); border:3px solid rgba(255,255,255,.75); color:#fff; font-weight:600;
    pointer-events:auto; transition:transform .08s, background .15s; touch-action:none; }
  .rbtn:active, .rbtn.down { transform:scale(.88); background:rgba(255,255,255,.35); }
  .rbtn .ico { line-height:1; }
  .rbtn .lbl { font-size:11px; margin-top:2px; text-shadow:0 1px 2px #000; }
  .slot { width:62px; height:62px; border-radius:10px; background:rgba(0,0,0,.35); border:3px solid transparent; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; line-height:1.1; text-align:center; }
  .slot .ico { font-size:24px; }
  .slot.active { border-color:#fff; background:rgba(255,255,255,.2); }
  .chip { background:rgba(15,30,25,.6); border-radius:8px; padding:4px 10px; font-size:12px; color:#fff; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,255,120,.7);} 50%{ box-shadow:0 0 0 12px rgba(255,255,120,0);} }
  .near { animation:pulse 1s infinite; }
</style>
</head>
<body data-mode="play">

<canvas id="gl" class="fixed inset-0 block" style="width:100%;height:100%"></canvas>

<!-- ================= UI OVERLAY ================= -->
<main id="ui" class="fixed inset-0 pointer-events-none">
  <!-- Efek layar: glare matahari (transform/opacity saja => murah di GPU) & kilat petir -->
  <div id="glareWash" class="absolute inset-0" style="opacity:0;mix-blend-mode:screen;background:radial-gradient(ellipse at center, rgba(255,244,214,.6), rgba(255,236,190,.3))"></div>
  <div id="glare" class="absolute left-0 top-0 rounded-full" style="width:75vmax;height:75vmax;opacity:0;mix-blend-mode:screen;will-change:transform,opacity;background:radial-gradient(circle, rgba(255,253,240,.95) 0, rgba(255,242,200,.55) 5%, rgba(255,220,150,.2) 20%, rgba(255,200,120,0) 58%)"></div>
  <div class="flare absolute left-0 top-0 rounded-full" data-t="-0.45" style="width:70px;height:70px;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle, rgba(255,235,170,.55), rgba(255,210,130,0) 70%)"></div>
  <div class="flare absolute left-0 top-0 rounded-full" data-t="0.25" style="width:40px;height:40px;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle, rgba(170,255,200,.45), rgba(120,220,170,0) 70%)"></div>
  <div class="flare absolute left-0 top-0 rounded-full" data-t="0.6" style="width:110px;height:110px;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle, rgba(160,200,255,0) 45%, rgba(160,200,255,.35) 62%, rgba(160,200,255,0) 72%)"></div>
  <div class="flare absolute left-0 top-0 rounded-full" data-t="1.1" style="width:55px;height:55px;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle, rgba(255,170,120,.45), rgba(255,140,100,0) 70%)"></div>
  <div id="flash" class="absolute inset-0 bg-white" style="opacity:0"></div>


  <!-- kanan atas: FPS + menu kualitas -->
  <div class="absolute top-2 right-2 flex items-start gap-2 pointer-events-auto">
    <div id="fps" class="chip">FPS: --</div>
    <button id="btnMenu" class="w-11 h-11 rounded-lg bg-black/50 text-white text-2xl leading-none" aria-label="Pengaturan">☰</button>
  </div>

  <!-- Modal Pengaturan Fullscreen Transparan & Scrollable -->
  <div id="settingsPopup" class="hidden fixed inset-0 z-[1000] flex items-center justify-center p-3 sm:p-6 bg-black/60 backdrop-blur-md pointer-events-auto">
    <div class="relative w-full max-w-md max-h-[88vh] flex flex-col rounded-2xl bg-slate-900/80 border border-white/20 shadow-2xl text-white overflow-hidden backdrop-blur-xl">
      <!-- Header Modal -->
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-white/10 bg-white/5">
        <div class="flex items-center gap-2 font-bold text-base tracking-wide">
          <span>⚙️</span><span>Pengaturan Game</span>
        </div>
        <button id="btnCloseSettings" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 active:scale-90 flex items-center justify-center text-white/80 font-bold transition-all" aria-label="Tutup">✕</button>
      </div>

      <!-- Body Modal (Scrollable) -->
      <div class="p-5 space-y-4 overflow-y-auto overscroll-contain text-sm" style="-webkit-overflow-scrolling:touch;">
        <!-- Kualitas Grafis -->

          <div id="qualityBtns" class="flex gap-2">
            <button data-q="0" class="qbtn flex-1 py-2.5 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">Low</button>
            <button data-q="1" class="qbtn flex-1 py-2.5 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">Medium</button>
            <button data-q="2" class="qbtn flex-1 py-2.5 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">High</button>

        </div>

        <!-- Limit FPS -->
        <div>
          <div class="text-xs font-semibold uppercase tracking-wider text-white/60 mb-1.5">Limit FPS</div>
          <div id="fpsLimitBtns" class="flex gap-2">
            <button data-fps="30" class="fps-btn flex-1 py-2 rounded-xl bg-white/10 border-2 border-transparent font-medium active:scale-95 transition-all">30 FPS</button>

          <div class="grid grid-cols-5 gap-1.5">
            <button data-tod="auto" class="tod-btn py-2 rounded-xl bg-white/10 border-2 border-transparent text-xs font-medium active:scale-95 transition-all">Auto</button>
            <button data-tod="dawn" class="tod-btn py-2 rounded-xl bg-white/10 border-2 border-transparent text-xs font-medium active:scale-95 transition-all">🌅 Pagi</button>
            <button data-tod="day" class="tod-btn py-2 rounded-xl bg-white/10 border-2 border-transparent text-xs font-medium active:scale-95 transition-all">☀️ Siang</button>

            <button id="btnSound" class="w-full py-2.5 rounded-xl bg-sky-600/75 hover:bg-sky-600/90 active:scale-[0.98] font-semibold transition-all">🔊 Suara: On</button>
          </div>
        </div>
      </div>

      <!-- Footer Modal -->
      <div class="px-5 py-3 border-t border-white/10 bg-white/5 flex justify-end">
        <button id="btnCloseSettingsBottom" class="w-full py-2.5 rounded-xl bg-white/15 hover:bg-white/25 active:scale-[0.98] font-semibold text-sm transition-all">Tutup Pengaturan</button>
      </div>
    </div>
  </div>

  <!-- kiri atas: Minimap + Inventory Ringkas -->
  <div class="absolute top-2 left-2 flex flex-col items-start gap-1 pointer-events-auto">
    <!-- Minimap Radar Container (Transparan & Glassmorphic) -->
    <div id="minimapWrap" class="relative rounded-2xl overflow-hidden border border-white/20 shadow-xl bg-slate-950/35 backdrop-blur-md" style="width:112px;height:112px;">
      <canvas id="minimapCanvas" width="112" height="112" class="block w-full h-full"></canvas>
      <div id="craftDistBadge" class="absolute bottom-1 left-1/2 -translate-x-1/2 px-1.5 py-0.5 rounded bg-black/60 backdrop-blur-sm border border-amber-400/30 text-[9px] text-amber-300 font-bold whitespace-nowrap shadow pointer-events-none">🔨 14m</div>
    </div>
    <!-- Badge Wood Ringkas -->
    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-black/45 backdrop-blur-sm border border-white/15 text-white text-xs font-semibold shadow">
      <span>🪵</span><span id="woodCount">0</span> <span class="text-white/60 text-[10px]">Wood</span>
    </div>
    <!-- Build Info & Tombol (Hanya saat mode build) -->
    <div id="buildInfo" class="build-only chip flex-col gap-0.5 leading-tight text-xs mt-0.5">
      <div id="statLine1"></div><div id="statLine2"></div>
    </div>
    <div class="build-only flex gap-1.5 pointer-events-auto mt-0.5">
      <button id="btnPreset" class="chip border border-white/30 text-xs py-1 px-2">✈️ Preset</button>
      <button id="btnClear" class="chip border border-white/30 text-xs py-1 px-2">🗑 Bersihkan</button>
    </div>
  </div>

  <!-- HUD penerbangan -->
  <div id="flightHud" class="drive-only absolute top-12 left-1/2 -translate-x-1/2 chip text-sm tracking-wide">--</div>

  <div id="toast" class="absolute top-16 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg bg-black/65 text-white text-sm opacity-0 transition-opacity duration-300 whitespace-nowrap"></div>

  <!-- Virtual joystick (kiri) -->
  <div id="joyBase" class="nobuild play-only absolute pointer-events-auto rounded-full"
       style="left:22px;bottom:22px;width:140px;height:140px;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);touch-action:none">
    <div id="joyKnob" class="absolute rounded-full" style="left:50%;top:50%;width:62px;height:62px;transform:translate(-50%,-50%);background:rgba(255,255,255,.5);border:2px solid rgba(255,255,255,.8)"></div>
  </div>

  <!-- Tombol aksi (kanan) -->
  <div class="absolute" style="right:12px;bottom:12px;width:250px;height:250px;pointer-events:none">
    <button id="btnJump"  class="rbtn play-only nodrive" style="right:8px;bottom:104px;width:66px;height:66px"><span class="ico text-2xl">🦘</span><span class="lbl">Lompat</span></button>
    <button id="btnChop"  class="rbtn play-only" style="right:100px;bottom:86px;width:70px;height:70px"><span id="chopIco" class="ico text-2xl">🪓</span><span id="chopLbl" class="lbl">Tebang</span></button>
    <button id="btnAct"   class="rbtn play-only" style="right:104px;bottom:6px;width:70px;height:70px"><span id="actIco" class="ico text-2xl">🚀</span><span id="actLbl" class="lbl">Interaksi</span></button>
    <button id="btnCraft" class="rbtn" style="right:0;bottom:0;width:92px;height:92px"><span class="ico text-4xl">🔨</span><span id="craftLbl" class="lbl text-sm">Craft</span></button>
  </div>

  <!-- Hotbar build mode -->
  <div id="hotbar" class="build-only absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 p-1.5 rounded-xl bg-emerald-900/75 border border-emerald-300/40 pointer-events-auto">
    <button class="slot active" data-tool="block"><span class="ico">🪵</span><span>Block<br><b id="slotWood">0</b> kayu</span></button>
    <button class="slot" data-tool="thruster"><span class="ico">🚀</span><span>Roket<br>Unlimited</span></button>
    <button class="slot" data-tool="wing"><span class="ico">🪽</span><span>Sayap<br>Gratis</span></button>
    <button class="slot" data-tool="del"><span class="ico">🧹</span><span>Hapus</span></button>
  </div>
</main>

<script>
/* =====================================================================
 *  LOW-POLY PHYSICS CRAFTING SANDBOX  —  single file, tanpa asset eksternal
 *  Struktur:
 *   1. Setup renderer/scene (optimasi mobile)      6. Particle (api / debu)
 *   2. Terrain prosedural (grid height + sampling) 7. Mode Build (grid snap)
 *   3. Pohon & batu (InstancedMesh)                8. Fisika kendaraan
 *   4. Karakter blocky + animasi                   9. Kamera, input, game loop
 *   5. Input / UI helper
 * ===================================================================== */
(() => {
'use strict';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);   // ?aa=1 => aktifkan antialias

/* ------------------------------------------------------------------ *
 * 1. RENDERER & SCENE  (optimasi: tanpa antialias, tanpa shadow map,
 *    Lambert material, pixel ratio terbatas, fog + far plane pendek)
 * ------------------------------------------------------------------ */
const SKY = 0xaee0ff;
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: params.get('aa') === '1', powerPreference: 'high-performance' });
renderer.shadowMap.enabled = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 250, 950);               // sembunyikan batas map luas dengan kabut atmosfer
const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 1100);
const hemi = new THREE.HemisphereLight(0xe3f3ff, 0x6f9250, 0.95); scene.add(hemi);
// Arah matahari (dipakai untuk cahaya, posisi sprite matahari, dan bayangan)
const SUN_DIR = new THREE.Vector3(0.5, 0.42, -0.76).normalize();
const sun = new THREE.DirectionalLight(0xfff2d8, 0.75); sun.position.copy(SUN_DIR).multiplyScalar(100); scene.add(sun); scene.add(sun.target);
// Konfigurasi shadow map (hanya dinyalakan saat kualitas HIGH)
sun.shadow.mapSize.set(1024, 1024);
{ const sc = sun.shadow.camera; sc.left = sc.bottom = -36; sc.right = sc.top = 36; sc.near = 1; sc.far = 220; sc.updateProjectionMatrix(); }
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.05;
let onQualityChange = null;                            // diisi oleh modul lingkungan (bayangan)

// Level kualitas (render scale). Default MED = pixel ratio maks 1.
const QUALITY = [
  { name: 'LOW',  pr: 0.6 },
  { name: 'MED',  pr: Math.min(devicePixelRatio || 1, 1) },
  { name: 'HIGH', pr: Math.min(devicePixelRatio || 1, 2) }
];
let qIdx = 1;
function applyQuality() {
  renderer.setPixelRatio(QUALITY[qIdx].pr);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (onQualityChange) onQualityChange();
}
addEventListener('resize', applyQuality);
applyQuality();

// Material cache & util
const matCache = {};
const lam = c => matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color: c }));
// Ubah geometry jadi flat-shaded (non-indexed + normal per face) => tampilan low-poly tajam
function flat(g) { const n = g.toNonIndexed(); n.computeVertexNormals(); g.dispose(); return n; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

/* ------------------------------------------------------------------ *
 * 2. TERRAIN PROSEDURAL
 *    Tinggi disimpan di grid (hGrid). Mesh dibangun dari grid yang sama
 *    dan groundY() meng-interpolasi segitiga yang sama => fisika pas
 *    dengan visual, tanpa raycast.
 * ------------------------------------------------------------------ */
function rng32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng32(1337);
function hash2(i, j) { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {                          // value noise 2D
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o) { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += vnoise(x * f, y * f) * a; n += a; a *= .5; f *= 2; } return s / n; }
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const T_SIZE = 1800, T_N = 200, T_D = T_SIZE / T_N, T_HALF = T_SIZE / 2, T_W = T_N + 1;
const SITE = { x: 0, y: 0.2, z: 14 };            // lokasi area rakit (pad)
const PAD_HALF = 4.7;
const hGrid = new Float32Array(T_W * T_W);

function genHeight(ix, iz) {
  const x = ix * T_D - T_HALF, z = iz * T_D - T_HALF;
  const rr = Math.hypot(x, z - 6);
  const flatF = sstep(45, 190, rr);                                  // dataran luas di sekitar spawn & pad
  let h = (fbm(x * .0025, z * .0025, 4) - .5) * 65 * flatF;          // perbukitan & lembah luas
  const m = sstep(480, 860, rr);                                     // cincin pegunungan tinggi di tepian map
  const ridge = 1 - Math.abs(2 * fbm(x * .003 + 9, z * .003 + 4, 4) - 1);
  h += m * (32 + ridge * ridge * 130);
  h += (hash2(ix, iz) - .5) * (1 + m * 6) * flatF;                  // kontur rugged/berbatu
  const cm = sstep(.48, .72, fbm(x * .0045 - 5, z * .0045 + 7, 2)); // tebing bertingkat
  const s = h / 7, f = Math.floor(s), fr = s - f;
  h += (((f + sstep(.4, .6, fr)) * 7) - h) * cm * .85 * flatF;
  return h;
}
for (let iz = 0; iz < T_W; iz++) for (let ix = 0; ix < T_W; ix++) hGrid[iz * T_W + ix] = genHeight(ix, iz);

// Interpolasi tinggi persis sesuai triangulasi mesh: (00,01,11) & (00,11,10)
function cellInfo(x, z) {
  const gx = clamp((x + T_HALF) / T_D, 0, T_N - 1e-4), gz = clamp((z + T_HALF) / T_D, 0, T_N - 1e-4);
  const ix = gx | 0, iz = gz | 0;
  return [ix, iz, gx - ix, gz - iz];
}
function terrainY(x, z) {
  const [ix, iz, u, v] = cellInfo(x, z);
  const h00 = hGrid[iz * T_W + ix], h10 = hGrid[iz * T_W + ix + 1], h01 = hGrid[(iz + 1) * T_W + ix], h11 = hGrid[(iz + 1) * T_W + ix + 1];
  return v >= u ? h00 + u * (h11 - h01) + v * (h01 - h00) : h00 + v * (h11 - h10) + u * (h10 - h00);
}
function groundNormal(x, z, out) {
  const [ix, iz, u, v] = cellInfo(x, z);
  const h00 = hGrid[iz * T_W + ix], h10 = hGrid[iz * T_W + ix + 1], h01 = hGrid[(iz + 1) * T_W + ix], h11 = hGrid[(iz + 1) * T_W + ix + 1];
  let dx, dz;
  if (v >= u) { dx = (h11 - h01) / T_D; dz = (h01 - h00) / T_D; } else { dx = (h10 - h00) / T_D; dz = (h11 - h10) / T_D; }
  return out.set(-dx, 1, -dz).normalize();
}
// Permukaan efektif = terrain + pad rakit (datar)
function surfaceY(x, z) {
  const t = terrainY(x, z);
  return (Math.abs(x - SITE.x) < PAD_HALF && Math.abs(z - SITE.z) < PAD_HALF) ? Math.max(t, SITE.y) : t;
}

function terrainColor(cy, ny, r) {
  if (cy > 85 && ny > .55) return [.92 + r * .06, .94 + r * .05, .97];        // salju di puncak pegunungan
  if (ny < .70) { const g = .36 + r * .14; return [g, g * .97, g * .92]; }     // tebing batu abu-abu
  if (ny < .82) { const g = .36 + r * .1; return [g + .14, g + .03, g * .7]; } // tanah berbatu
  const t = clamp(cy / 60, 0, 1);                                              // rumput
  return [.25 + r * .08 + t * .10, .62 + r * .10 - t * .14, .17 + r * .05];
}
(function buildTerrain() {

const mmCanvas = $('minimapCanvas'), mmCtx = mmCanvas.getContext('2d');
const MM_RAD = 52, MM_CX = 56, MM_CY = 56, MM_WORLD_RAD = 260; // radius radar 260 meter
function drawMinimap() {
  const ctx = mmCtx;
  ctx.clearRect(0, 0, 112, 112);
  ctx.save();
  ctx.beginPath();
  ctx.arc(MM_CX, MM_CY, MM_RAD, 0, TAU);
  ctx.clip();

  // Background radar transparan (glassmorphism)
  const bgGrad = ctx.createRadialGradient(MM_CX, MM_CY, 4, MM_CX, MM_CY, MM_RAD);
  bgGrad.addColorStop(0, 'rgba(10, 24, 42, 0.35)');
  bgGrad.addColorStop(0.7, 'rgba(8, 18, 32, 0.45)');
  bgGrad.addColorStop(1, 'rgba(5, 12, 24, 0.60)');
  ctx.fillStyle = bgGrad;
  ctx.fill();

  // Cincin grid jarak & border luar halus
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.10)';
  ctx.lineWidth = 1;
  for (const r of [18, 36, 51]) {
    ctx.beginPath(); ctx.arc(MM_CX, MM_CY, r, 0, TAU); ctx.stroke();
  }
  // Garis silang halus
  ctx.beginPath();
  ctx.moveTo(MM_CX, MM_CY - MM_RAD); ctx.lineTo(MM_CX, MM_CY + MM_RAD);
  ctx.moveTo(MM_CX - MM_RAD, MM_CY); ctx.lineTo(MM_CX + MM_RAD, MM_CY);
  ctx.stroke();

  // Arah utara (North)
  ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
  ctx.font = 'bold 8px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('N', MM_CX, 3);

  const focus = mode === 'drive' ? veh.pos : player;
  const scale = MM_RAD / MM_WORLD_RAD;

  // Indikator Crafting Pad (SITE)
  const cdx = SITE.x - focus.x, cdz = SITE.z - focus.z;
  const craftDist = Math.hypot(cdx, cdz);
  $('craftDistBadge').textContent = '🔨 ' + (craftDist < 1000 ? Math.round(craftDist) + 'm' : (craftDist / 1000).toFixed(1) + 'km');

  if (craftDist * scale <= MM_RAD - 8) {
    const px = MM_CX + cdx * scale, py = MM_CY + cdz * scale;
    ctx.fillStyle = 'rgba(255, 180, 0, 0.35)';
    ctx.beginPath(); ctx.arc(px, py, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath(); ctx.arc(px, py, 4.5, 0, TAU); ctx.fill();
    ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🔨', px, py - 8);
  } else {
    // Clamped di pinggiran radar jika berada jauh
    const ang = Math.atan2(cdz, cdx);
    const edgeR = MM_RAD - 7;
    const ex = MM_CX + Math.cos(ang) * edgeR, ey = MM_CY + Math.sin(ang) * edgeR;
    const pulse = 0.6 + Math.sin(time * 6) * 0.4;
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(ang);
    ctx.fillStyle = `rgba(255, 190, 40, ${pulse})`;
    ctx.beginPath();
    ctx.moveTo(7, 0); ctx.lineTo(-6, -5); ctx.lineTo(-3, 0); ctx.lineTo(-6, 5); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Indikator Kendaraan (jika sedang tidak dikemudikan)
  if (veh.sim && mode === 'play') {
    const vdx = veh.pos.x - focus.x, vdz = veh.pos.z - focus.z;
    const vDist = Math.hypot(vdx, vdz);
    if (vDist * scale <= MM_RAD - 6) {
      const vx = MM_CX + vdx * scale, vy = MM_CY + vdz * scale;
      ctx.fillStyle = '#ff4444';
      ctx.beginPath(); ctx.arc(vx, vy, 4, 0, TAU); ctx.fill();
      ctx.font = '9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🚀', vx, vy - 7);
    }
  }

  // Fokus Pemain di Tengah (Pulsing ring + Core dot)
  ctx.fillStyle = 'rgba(0, 229, 255, 0.25)';
  ctx.beginPath(); ctx.arc(MM_CX, MM_CY, 7, 0, TAU); ctx.fill();
  ctx.fillStyle = '#00e5ff';
  ctx.beginPath(); ctx.arc(MM_CX, MM_CY, 3, 0, TAU); ctx.fill();

  // Arah hadap (heading) yang 100% akurat dan sinkron dengan koordinat 3D:
  // Di minimap: sumbu -Z adalah Atas (-Y canvas / Utara), sumbu +X adalah Kanan (+X canvas / Timur)
  let fx, fz;
  if (mode === 'drive') {
    fx = _f.x;
    fz = _f.z;
  } else {
    fx = Math.sin(player.yaw);
    fz = Math.cos(player.yaw);
  }
  const heading = Math.atan2(fx, -fz);

  ctx.save();
  ctx.translate(MM_CX, MM_CY);
  ctx.rotate(heading);

  // Kerucut pandang lembut (view cone) agar arah pandang terlihat jelas
  const coneGrad = ctx.createRadialGradient(0, 0, 2, 0, -14, 16);
  coneGrad.addColorStop(0, 'rgba(0, 229, 255, 0.35)');
  coneGrad.addColorStop(1, 'rgba(0, 229, 255, 0.0)');
  ctx.fillStyle = coneGrad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-8, -18);
  ctx.lineTo(8, -18);
  ctx.closePath();
  ctx.fill();

  // Panah penunjuk arah tajam, presisi, dan kontras
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -11);      // Ujung panah tajam menunjuk ke depan
  ctx.lineTo(-4.5, 3.5);   // Sayap kiri
  ctx.lineTo(0, 0.5);      // Cekungan dalam
  ctx.lineTo(4.5, 3.5);    // Sayap kanan
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();

  ctx.restore();
}

  glareEl.style.opacity = (sunVis * (.55 + center * .45)).toFixed(3);
  washEl.style.opacity = (sunVis * center * center * .5).toFixed(3);

    sky: new THREE.Color(k0.sky).lerp(_c.set(k1.sky), f),
    fog: new THREE.Color(k0.fog).lerp(_c.set(k1.fog), f),
    sun: new THREE.Color(k0.sun).lerp(_c.set(k1.sun), f),
    hemiS: new THREE.Color(k0.hemiS).lerp(_c.set(k1.hemiS), f),
    hemiG: new THREE.Color(k0.hemiG).lerp(_c.set(k1.hemiG), f),
    sunI: k0.sunI + (k1.sunI - k0.sunI) * f,
    hemiI: k0.hemiI + (k1.hemiI - k0.hemiI) * f,
    night: k0.night + (k1.night - k0.night) * f
  };
}

// --- State cuaca ---
const wx = { mode: 'auto', k: 0, target: 0, timer: 50 + Math.random() * 40, flashT: 9, nextBolt: 3 };
const C_SKY_RAIN = new THREE.Color(0x56626d), C_FLASH = new THREE.Color(0xe6edff), C_CLOUD_RAIN = new THREE.Color(0x4a545e);
const C_SUN_RAIN = new THREE.Color(0xb0bcc9);
const cloudMat = clouds[0].children[0].material;
// pola kilat: terang - redup - terang - meluruh (seperti petir asli)
const flashLevel = t => t < .06 ? 1 : t < .12 ? .25 : t < .2 ? .85 : Math.max(0, .85 * Math.exp(-(t - .2) * 7));
function strike(focus) {
  const a = Math.random() * TAU, d = 40 + Math.random() * 80;
  buildBolt(clamp(focus.x + Math.cos(a) * d, -T_HALF + 5, T_HALF - 5), clamp(focus.z + Math.sin(a) * d, -T_HALF + 5, T_HALF - 5));
  wx.flashT = 0;
  thunder(d / 70, clamp(1.1 - d / 140, .25, .9));
}
function updateWeather(dt) {
  const focus = mode === 'drive' ? veh.pos : mode === 'build' ? SITE : player;

  // 1. Update Waktu Hari (Time of Day)
  if (tod.mode === 'auto') {
    tod.time = (tod.time + tod.speed * dt) % 1.0;
  } else {
    const tgt = TOD_TARGETS[tod.mode];
    let diff = tgt - tod.time;
    if (diff > 0.5) diff -= 1.0;
    if (diff < -0.5) diff += 1.0;
    tod.time = (tod.time + clamp(diff, -dt * 0.4, dt * 0.4) + 1.0) % 1.0;
  }

  // 1b. Lintasan Matahari di Langit (Pagi -> Siang -> Sore)
  // Rentang siang aktif dari fajar (0.15) hingga senja (0.83)
  const isDay = tod.time >= 0.15 && tod.time <= 0.83;
  let sunX, sunY, sunZ;
  if (isDay) {
    const df = (tod.time - 0.15) / (0.83 - 0.15); // 0 (fajar) .. 0.5 (tengah hari) .. 1 (senja terbenam)
    // Ketinggian matahari:
    // Pagi (tod=0.25): elevasi ~0.26
    // Siang (tod=0.50): elevasi ~0.48 (puncak benderang)
    // Sore (tod=0.75): elevasi ~0.11 (sangat rendah, tepat di atas horizon bukit mau terbenam!)
    if (df < 0.5) {
      const u = df / 0.5;
      sunY = 0.16 + 0.32 * Math.sin(u * Math.PI * 0.5);
    } else {
      const u = (df - 0.5) / 0.5; // 0 di siang, ~0.88 di sore (0.75)
      sunY = 0.48 - 0.42 * u;     // saat u = 0.88 (sore), sunY = ~0.11 (sunset)
    }
    // Azimuth: melengkung dari timur (kiri-depan) ke barat (kanan-depan) selalu di depan kamera (-Z)
    const az = (df - 0.5) * 1.65;
    sunX = Math.sin(az) * 0.78;
    sunZ = -Math.cos(az) * 0.78;
  } else {
    // Malam hari: matahari tenggelam di bawah cakrawala
    sunY = -0.45; sunX = 0; sunZ = 1;
  }
  SUN_DIR.set(sunX, sunY, sunZ).normalize();

  // Posisi directional light & bayangan
  const isSunUp = SUN_DIR.y > 0.04;
  const lightDir = isSunUp ? SUN_DIR : _t1.set(0.3, 0.45, -0.8).normalize();
  sun.position.set(focus.x + lightDir.x * 100, focus.y + lightDir.y * 100, focus.z + lightDir.z * 100);
  sun.target.position.set(focus.x, focus.y, focus.z); sun.target.updateMatrixWorld();

  // Posisi Bulan di langit malam (tampak jelas di langit malam pada arah hadap kamera)
  const MOON_DIR = _t2.set(-0.35, 0.42, -0.80).normalize();
  moonSprite.position.copy(camera.position).addScaledVector(MOON_DIR, 800);

  // Sampling warna langit & pencahayaan sesuai waktu hari
  const pal = sampleSky(tod.time);
  const nightFactor = pal.night;

  // Efek visual matahari sore (sunset illusion & corona jingga membara)
  const duskFactor = Math.max(0, 1 - Math.abs(tod.time - 0.75) / 0.14);
  // Matahari tampak lebih besar saat mau terbenam di horizon (sunset illusion)
  sunSprite.scale.setScalar(175 + duskFactor * 65);

  // Warna bola matahari: jauh lebih jingga kemerahan menyala saat sore
  if (duskFactor > 0.02) {
    sunSprite.material.color.copy(pal.sun).lerp(new THREE.Color(0xff2200), duskFactor * 0.88);
  } else {
    sunSprite.material.color.copy(pal.sun);
  }

  // Glare layar bernuansa jingga hangat keemasan saat sore
  if (duskFactor > 0.15) {
    glareEl.style.background = 'radial-gradient(circle, rgba(255,140,25,.95) 0, rgba(255,80,10,.6) 10%, rgba(255,50,5,.25) 26%, rgba(255,30,0,0) 65%)';
    washEl.style.background = 'radial-gradient(ellipse at center, rgba(255,100,25,.5), rgba(255,60,15,.2))';
  } else {
    glareEl.style.background = 'radial-gradient(circle, rgba(255,253,240,.95) 0, rgba(255,242,200,.55) 5%, rgba(255,220,150,.2) 20%, rgba(255,200,120,0) 58%)';
    washEl.style.background = 'radial-gradient(ellipse at center, rgba(255,244,214,.6), rgba(255,236,190,.3))';
  }

  // Bintang & Bulan
  stars.position.copy(camera.position);
  starMat.opacity = nightFactor * (1 - wx.k * 0.8);
  moonSprite.material.opacity = nightFactor * (1 - wx.k) * 0.95;

  // Lampu Senter / Headlight pemain saat malam / sore
  headLight.position.set(focus.x, focus.y + 1.8, focus.z);
  headLight.intensity = (nightFactor * 1.8 + (tod.mode === 'dusk' ? 0.7 : 0));

  // Animasi suar pilar crafting beacon & SEMBUNYIKAN saat mode build/crafting agar tidak menghalangi pandangan
  beaconGroup.visible = (mode !== 'build');
  if (beaconGroup.visible) {
    beaconRing.rotation.y += dt * 0.6;
    beaconRing.scale.setScalar(1 + Math.sin(time * 3) * 0.14);
    beamMat.opacity = (0.24 + Math.sin(time * 2) * 0.12) * (1 - nightFactor * 0.3);
  }

  // 2. Update Cuaca (Cerah / Hujan / Petir)
  if (wx.mode === 'auto') {
    wx.timer -= dt;
    if (wx.timer <= 0) {
      wx.target = wx.target ? 0 : 1;
      wx.timer = wx.target ? 45 + Math.random() * 40 : 70 + Math.random() * 70;
      toast(wx.target ? '🌧️ Hujan mulai turun...' : '☀️ Cuaca cerah kembali');
    }
  } else wx.target = wx.mode === 'rain' ? 1 : 0;
  wx.k += clamp(wx.target - wx.k, -dt / 7, dt / 7);
  const k = wx.k;

  if (k > .6) { wx.nextBolt -= dt; if (wx.nextBolt <= 0) { strike(focus); wx.nextBolt = 4 + Math.random() * 9; } }
  wx.flashT += dt;
  const fl = wx.flashT < 1.5 ? flashLevel(wx.flashT) : 0;
  bolt.visible = wx.flashT < .32 && fl > .2;

  // Interpolasi Langit, Kabut, Matahari dengan Cuaca & Petir
  scene.background.copy(pal.sky).lerp(C_SKY_RAIN, k).lerp(C_FLASH, fl * .7);
  scene.fog.color.copy(pal.fog).lerp(C_SKY_RAIN, k).lerp(C_FLASH, fl * .7);
  scene.fog.near = (250 - 160 * k); scene.fog.far = (950 - 450 * k);
  hemi.color.copy(pal.hemiS); hemi.groundColor.copy(pal.hemiG);
  hemi.intensity = pal.hemiI * (1 - 0.35 * k) + fl * 1.2;
  sun.intensity = pal.sunI * (1 - 0.65 * k);
  sun.color.copy(pal.sun).lerp(C_SUN_RAIN, k);
  cloudMat.color.setRGB(1, 1, 1).lerp(new THREE.Color(0x353d48), nightFactor * 0.7).lerp(C_CLOUD_RAIN, k);
  flashEl.style.opacity = fl > .01 ? (fl * .35).toFixed(3) : 0;

  updateRain(dt, k, focus);
  updateSun(dt, (1 - k) * (1 - nightFactor));
  if (sfx.rainGain) { const g = sfx.on ? k * .16 : 0; if (Math.abs(g - sfx.last) > .003) { sfx.rainGain.gain.value = g; sfx.last = g; } }

  // 3. Render Minimap Radar
  drawMinimap();
}

// --- UI pengaturan cuaca, waktu hari & suara ---
function refreshWxUI() {
  document.querySelectorAll('.wx-btn').forEach(b => { const act = b.dataset.wx === wx.mode;
    b.style.borderColor = act ? '#fff' : 'transparent'; b.style.background = act ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)'; });
  document.querySelectorAll('.tod-btn').forEach(b => { const act = b.dataset.tod === tod.mode;
    b.style.borderColor = act ? '#fff' : 'transparent'; b.style.background = act ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.1)'; });
  $('btnSound').textContent = sfx.on ? '🔊 Suara: On' : '🔇 Suara: Off';
}
$('btnMenu').addEventListener('pointerdown', refreshWxUI);
document.querySelectorAll('.wx-btn').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault(); wx.mode = b.dataset.wx;
  if (wx.mode === 'auto') { wx.target = wx.k > .5 ? 1 : 0; wx.timer = 40 + Math.random() * 40; }
  if (wx.mode === 'rain') wx.nextBolt = 2;
  refreshWxUI(); toast(`Cuaca: ${b.textContent}`);
}));
document.querySelectorAll('.tod-btn').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault(); tod.mode = b.dataset.tod;
  refreshWxUI(); toast(`Waktu: ${b.textContent}`);
}));
$('btnSound').addEventListener('pointerdown', e => { e.preventDefault(); sfx.on = !sfx.on; refreshWxUI(); });

/* ---------- Game loop ---------- */
let last = performance.now(), fAcc = 0, fN = 0;
function update(dt) {
  time += dt;
  for (const c of clouds) { c.position.x += dt * 2.5; if (c.position.x > 900) c.position.x = -900; }
  if (mode === 'play') updatePlayer(dt);
  if (veh.sim) {                                  // 2 sub-step agar tidak tembus tanah saat cepat
    const h = dt / 2; stepVehicle(h, mode === 'drive'); stepVehicle(h, mode === 'drive'); applyVehicleTransform();
    vehBlob.visible = true; const gy = surfaceY(veh.pos.x, veh.pos.z); vehBlob.position.set(veh.pos.x, gy + .06, veh.pos.z);
    vehBlob.scale.setScalar(clamp(3 - (veh.pos.y - gy) * .04, 1, 3));
  } else vehBlob.visible = false;
  // bayangan blob murah hanya dipakai jika shadow map OFF
  if (shadowsOn) vehBlob.visible = false;
  playerBlob.visible = !shadowsOn && mode !== 'drive';
  if (mode === 'drive') {
    $('flightHud').textContent = `SPD ${(veh.vel.length() * 3.6) | 0} km/h  •  ALT ${Math.max(0, veh.pos.y - surfaceY(veh.pos.x, veh.pos.z)) | 0} m  •  🔥 ${veh.stats.thr}  🪽 ${veh.stats.wings}`;
  }
  // animasi pohon (tumbang / getar)
  if (animTrees.size) {
    for (const i of animTrees) {
      const t = treeData[i];
      if (t.state === 1) { t.t += dt; if (t.t >= .95) { t.state = 2; animTrees.delete(i); } }
      else { t.shake -= dt; if (t.shake <= 0) { t.shake = 0; animTrees.delete(i); } }
      writeTree(i);
    }
    markTrees();
  }
  fireFX.update(dt); dustFX.update(dt);
  updateCamera(dt);
  updateWeather(dt);                              // setelah kamera: sprite matahari, glare & hujan ikut posisi kamera
  // Visibilitas tombol Craft berdasarkan lokasi area crafting
  const nearCraftArea = Math.hypot(player.x - SITE.x, player.z - SITE.z) <= 8.5;
  if (mode === 'play') {
    $('btnCraft').style.display = nearCraftArea ? 'flex' : 'none';
    $('btnCraft').classList.toggle('near', nearCraftArea);
  } else if (mode === 'build') {
    $('btnCraft').style.display = 'flex';
    $('btnCraft').classList.remove('near');
  } else {
    $('btnCraft').style.display = 'none';
  }
  // Tombol Interaksi (btnAct): HANYA tampil jika memang ada sesuatu yang bisa di-interaksikan!
  const canInteract = (mode === 'drive') || (mode === 'play' && veh.sim && parts.size > 0 && Math.hypot(player.x - veh.pos.x, player.z - veh.pos.z) <= 9);
  $('btnAct').style.display = canInteract ? 'flex' : 'none';
  $('btnAct').classList.toggle('near', mode === 'play' && canInteract);
}
function loop(now) {
  requestAnimationFrame(loop);
  if (fpsLimit > 0) {
    const minDelta = (1000 / fpsLimit) - 1.5; // toleransi jitter timer rAF
    if (now - last < minDelta) return;
  }
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); renderer.render(scene, camera);
  fAcc += dt; fN++; if (fAcc >= .5) { $('fps').textContent = 'FPS: ' + Math.round(fN / fAcc); fAcc = 0; fN = 0; }
}

// Inisialisasi: kendaraan kosong siap, pemain di dekat pad
updateStats(); prepareVehicle(); veh.sim = false;
vehGroup.position.set(SITE.x, SITE.y, SITE.z); partRoot.position.set(0, 0, 0);
toast('Tebang pohon 🪓 lalu tekan Craft 🔨 untuk merakit roket!');
requestAnimationFrame(loop);
})();
</script>
</body>
